<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>日本語 単語帳</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+KR:wght@400;600;700&display=swap');

    :root {
      --bg: #F4F3EF;
      --card: #fff;
      --ink: #1A1A2E;
      --sub: #6B7280;
      --accent: #D94F3D;
      --blue: #3A7BDE;
      --green: #27AE60;
      --wrong: #E74C3C;
      --border: #E5E7EB;
      --radius: 12px;
      --gold: #F5A623;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      font-family: "Noto Sans KR", "Noto Sans JP", sans-serif;
      color: var(--ink);
      min-height: 100vh;
    }

    #hdr {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--ink);
      color: #fff;
      padding: 10px 18px;
    }

    #hdr-top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px;
    }

    .logo {
      font-size: 18px;
      font-weight: 700;
    }

    .logo span {
      color: var(--accent);
    }

    #hdr-stats {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .chip {
      background: rgba(255, 255, 255, .13);
      border-radius: 99px;
      padding: 3px 11px;
      font-size: 12px;
    }

    #recent-w {
      font-size: 11px;
      color: rgba(255, 255, 255, .5);
      margin-top: 3px;
      min-height: 15px;
    }

    #drive-bar {
      display: flex;
      gap: 7px;
      align-items: center;
      margin-top: 7px;
      flex-wrap: wrap;
    }

    .dbtn {
      border: none;
      border-radius: 7px;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 12px;
      background: rgba(255, 255, 255, .15);
      color: #fff;
    }

    .dbtn:hover {
      background: rgba(255, 255, 255, .25);
    }

    .dbtn-save {
      background: rgba(66, 133, 244, .7);
    }

    .dbtn-load {
      background: rgba(52, 168, 83, .7);
    }

    #drive-st {
      font-size: 11px;
      color: rgba(255, 255, 255, .55);
    }

    #main {
      max-width: 780px;
      margin: 0 auto;
      padding: 16px;
    }

    #tab-nav {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 8px 16px;
      border: 1.5px solid var(--border);
      border-radius: 99px;
      background: #fff;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      color: var(--sub);
    }

    .tab-btn.active {
      background: var(--ink);
      border-color: var(--ink);
      color: #fff;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 20px 18px;
      box-shadow: 0 1px 8px rgba(0, 0, 0, .06);
      margin-bottom: 12px;
    }

    .btn {
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
    }

    .btn:hover {
      opacity: .86;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      padding: 11px 20px;
      font-size: 14px;
    }

    .btn-blue {
      background: var(--blue);
      color: #fff;
      padding: 8px 16px;
      font-size: 13px;
    }

    .btn-ghost {
      background: var(--border);
      color: var(--sub);
      padding: 8px 14px;
      font-size: 13px;
    }

    .btn-danger {
      background: #FEE2E2;
      color: var(--wrong);
      padding: 6px 12px;
      font-size: 12px;
    }

    .btn-sm {
      padding: 5px 11px;
      font-size: 12px;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    #dict-toolbar {
      display: flex;
      gap: 7px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    #dict-search {
      flex: 1;
      min-width: 130px;
      padding: 7px 13px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
    }

    #dict-search:focus {
      outline: none;
      border-color: var(--blue);
    }

    .seg-ctrl {
      display: flex;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .seg-btn {
      padding: 6px 12px;
      border: none;
      background: #fff;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      color: var(--sub);
    }

    .seg-btn.active {
      background: var(--ink);
      color: #fff;
      font-weight: 700;
    }

    .sort-row {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .sort-sel {
      padding: 5px 9px;
      border: 1.5px solid var(--border);
      border-radius: 7px;
      font-size: 12px;
      font-family: inherit;
    }

    #theme-filter,
    #quiz-theme-filter,
    #fc-theme-filter,
    #edit-theme-filter {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .tchip {
      padding: 4px 11px;
      border: 1.5px solid var(--border);
      border-radius: 99px;
      font-size: 12px;
      cursor: pointer;
      background: #fff;
      color: var(--sub);
      white-space: nowrap;
    }

    .tchip:hover {
      border-color: var(--blue);
      color: var(--blue);
    }

    .tchip.active {
      background: var(--ink);
      border-color: var(--ink);
      color: #fff;
      font-weight: 700;
    }

    .dict-scroll {
      max-height: 480px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .dtbl {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .dtbl th {
      background: #F8F9FA;
      padding: 7px 9px;
      text-align: left;
      font-size: 11px;
      color: var(--sub);
      font-weight: 700;
      border-bottom: 2px solid var(--border);
      white-space: nowrap;
    }

    .dtbl td {
      padding: 7px 9px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    .dtbl tr:last-child td {
      border-bottom: none;
    }

    .dtbl tr:hover td {
      background: #FAFBFC;
    }

    .kana {
      font-family: "Noto Sans JP", sans-serif;
    }

    .tag-m {
      font-size: 10px;
      background: #FFF3CD;
      color: #856404;
      border: 1px solid #FFD700;
      border-radius: 99px;
      padding: 1px 6px;
      font-weight: 700;
    }

    .tag-w {
      font-size: 10px;
      background: #FEE2E2;
      color: var(--wrong);
      border: 1px solid #FCA5A5;
      border-radius: 99px;
      padding: 1px 6px;
      font-weight: 700;
    }

    .pool-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .ptab {
      padding: 6px 13px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      background: #fff;
      font-size: 13px;
      cursor: pointer;
      color: var(--sub);
      font-family: inherit;
    }

    .ptab.active {
      background: var(--ink);
      border-color: var(--ink);
      color: #fff;
      font-weight: 700;
    }

    #quiz-n-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      margin: 12px 0;
    }

    #quiz-n {
      width: 65px;
      padding: 6px 9px;
      border: 1.5px solid var(--border);
      border-radius: 7px;
      font-size: 14px;
      font-family: inherit;
      text-align: center;
    }

    .cat-info {
      font-size: 12px;
      background: #EEF4FF;
      border: 1px solid var(--blue);
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 12px;
      color: #2952A3;
    }

    .qprog-bg {
      height: 5px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 4px;
    }

    .qprog-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 99px;
      transition: width .3s;
    }

    #qprog-txt {
      font-size: 11px;
      color: var(--sub);
      text-align: right;
      margin-bottom: 12px;
    }

    #streak-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--sub);
      min-height: 20px;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }

    .sdot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--border);
    }

    .sdot.on {
      background: var(--green);
    }

    #qword {
      font-size: 46px;
      font-weight: 700;
      text-align: center;
      padding: 20px 8px 6px;
      line-height: 1.25;
      word-break: break-all;
    }

    #qsub {
      text-align: center;
      font-size: 14px;
      color: var(--sub);
      margin-bottom: 6px;
      min-height: 20px;
    }

    #hint-area {
      text-align: center;
      min-height: 24px;
      margin-bottom: 10px;
    }

    .hint-kana {
      font-family: "Noto Sans JP", sans-serif;
      font-size: 18px;
      color: var(--sub);
      display: none;
    }

    .btn-hint {
      background: #FFF9E6;
      border: 1.5px solid var(--gold);
      color: #92640A;
      border-radius: 7px;
      padding: 4px 13px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    #qmode-hint {
      text-align: center;
      font-size: 12px;
      color: var(--sub);
      margin-bottom: 14px;
    }

    .choices {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .cbtn {
      padding: 12px 15px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: #FAFAFA;
      font-size: 14px;
      font-family: inherit;
      text-align: left;
      cursor: pointer;
    }

    .cbtn:hover:not(:disabled) {
      border-color: var(--blue);
      background: #EEF4FF;
    }

    .cbtn.ok {
      border-color: var(--green);
      background: #EAFAF1;
      color: #1E8449;
    }

    .cbtn.ng {
      border-color: var(--wrong);
      background: #FDEDEC;
      color: #922B21;
    }

    #ans-input {
      width: 100%;
      padding: 12px 15px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 16px;
      font-family: "Noto Sans JP", "Noto Sans KR", sans-serif;
      text-align: center;
      margin-bottom: 10px;
    }

    #ans-input:focus {
      outline: none;
      border-color: var(--blue);
    }

    #ans-input.ok {
      border-color: var(--green);
      background: #EAFAF1;
    }

    #ans-input.ng {
      border-color: var(--wrong);
      background: #FDEDEC;
    }

    #submit-btn {
      width: 100%;
      padding: 12px;
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
    }

    #qfeedback {
      min-height: 24px;
      margin-top: 11px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
    }

    #qfeedback.ok {
      color: var(--green);
    }

    #qfeedback.ng {
      color: var(--wrong);
    }

    #master-toast {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: #212529;
      color: var(--gold);
      font-size: 13px;
      font-weight: 700;
      padding: 8px 20px;
      border-radius: 99px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s;
      z-index: 999;
    }

    #master-toast.show {
      opacity: 1;
    }

    .rbig {
      text-align: center;
      font-size: 56px;
      font-weight: 700;
      color: var(--blue);
      padding: 6px 0;
    }

    .rsub {
      text-align: center;
      font-size: 14px;
      color: var(--sub);
      margin-bottom: 16px;
    }

    .wlist {
      background: #FFF8F8;
      border: 1px solid #FDD;
      border-radius: 10px;
      padding: 11px 13px;
      max-height: 200px;
      overflow-y: auto;
      font-size: 13px;
    }

    .wrow {
      display: flex;
      gap: 8px;
      padding: 3px 0;
      border-bottom: 1px solid #FFE4E4;
    }

    .wrow:last-child {
      border-bottom: none;
    }

    .wq {
      color: var(--wrong);
      font-weight: 700;
      min-width: 90px;
    }

    .rbtns {
      display: flex;
      gap: 7px;
      margin-top: 14px;
    }

    .rbtns .btn {
      flex: 1;
      padding: 10px 0;
      font-size: 13px;
    }

    .fc-wrap {
      perspective: 1000px;
      width: 100%;
      max-width: 480px;
      margin: 0 auto 18px;
      cursor: pointer;
      user-select: none;
    }

    .fc-inner {
      position: relative;
      width: 100%;
      padding-top: 58%;
      transition: transform .5s;
      transform-style: preserve-3d;
    }

    .fc-inner.flipped {
      transform: rotateY(180deg);
    }

    .fc-front,
    .fc-back {
      position: absolute;
      inset: 0;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      backface-visibility: hidden;
      text-align: center;
    }

    .fc-front {
      background: var(--card);
      border: 2px solid var(--border);
      box-shadow: 0 4px 20px rgba(0, 0, 0, .08);
    }

    .fc-back {
      background: linear-gradient(135deg, #1A1A2E, #2E3A6E);
      color: #fff;
      transform: rotateY(180deg);
    }

    .fc-kana {
      font-family: "Noto Sans JP", sans-serif;
      font-size: 13px;
      color: var(--sub);
      margin-bottom: 6px;
    }

    .fc-word {
      font-size: 38px;
      font-weight: 700;
      line-height: 1.2;
      word-break: break-all;
    }

    .fc-sub {
      font-size: 13px;
      color: rgba(255, 255, 255, .65);
      margin-top: 8px;
    }

    .fc-hint {
      font-size: 12px;
      color: var(--sub);
      margin-top: 10px;
    }

    .fc-btns {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .fc-btn-no {
      background: #FEE2E2;
      color: var(--wrong);
      border: none;
      border-radius: 12px;
      padding: 14px 30px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }

    .fc-btn-yes {
      background: #D1FAE5;
      color: #065F46;
      border: none;
      border-radius: 12px;
      padding: 14px 30px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }

    .fc-snd {
      background: none;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
      color: var(--sub);
    }

    .fc-prog {
      font-size: 12px;
      color: var(--sub);
      text-align: center;
      margin-bottom: 12px;
    }

    .etbl {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    .etbl th {
      background: #F8F9FA;
      padding: 6px 7px;
      font-size: 10px;
      color: var(--sub);
      font-weight: 700;
      text-align: left;
      border-bottom: 2px solid var(--border);
    }

    .etbl td {
      padding: 3px 5px;
      border-bottom: 1px solid var(--border);
    }

    .einp {
      width: 100%;
      padding: 4px 6px;
      border: 1.5px solid var(--border);
      border-radius: 5px;
      font-size: 12px;
      font-family: inherit;
    }

    .einp:focus {
      outline: none;
      border-color: var(--blue);
    }

    .btn-del {
      background: #FEE2E2;
      color: var(--wrong);
      border: none;
      border-radius: 5px;
      padding: 3px 8px;
      font-size: 11px;
      cursor: pointer;
    }

    .escroll {
      max-height: 400px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .addrow {
      display: flex;
      gap: 6px;
      margin-bottom: 9px;
      flex-wrap: wrap;
    }

    .addrow input,
    .addrow select {
      flex: 1;
      min-width: 70px;
      padding: 7px 9px;
      border: 1.5px solid var(--border);
      border-radius: 7px;
      font-size: 12px;
      font-family: inherit;
    }

    #theme-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .5);
      z-index: 500;
      align-items: center;
      justify-content: center;
    }

    #theme-modal-inner {
      background: #fff;
      border-radius: 14px;
      padding: 22px;
      width: 90%;
      max-width: 460px;
      max-height: 80vh;
      overflow-y: auto;
    }

    ::-webkit-scrollbar {
      width: 5px;
    }

    ::-webkit-scrollbar-thumb {
      background: #ccc;
      border-radius: 99px;
    }
  </style>
</head>

<body>
  <div id="hdr">
    <div id="hdr-top">
      <div class="logo"><span>日本語</span> 単語帳</div>
      <div id="hdr-stats">
        <div class="chip">📚 총 <b id="h-total">0</b>개</div>
        <div class="chip">⭐ 마스터 <b id="h-master">0</b>개</div>
        <div class="chip">❌ 오답 <b id="h-wrong">0</b>개</div>
        <div class="chip">⭐ 즐겨찾기 <b id="h-fav">0</b>개</div>
      </div>
    </div>
    <div id="recent-w">최근 틀린 단어: 없음</div>
    <div id="drive-bar">
      <button id="btn-login" class="dbtn" onclick="gLogin()" style="display:none">🔑 구글 로그인</button>
      <button id="btn-save" class="dbtn dbtn-save" onclick="gSave()" style="display:none">☁️ 저장</button>
      <button id="btn-load" class="dbtn dbtn-load" onclick="gLoad()" style="display:none">📂 불러오기</button>
      <span id="drive-st"></span>
    </div>
  </div>
  <div id="main">
    <div id="tab-nav">
      <button class="tab-btn active" onclick="setTab('dict')">📖 단어장</button>
      <button class="tab-btn" onclick="setTab('flash')">🃏 플래시카드</button>
      <button class="tab-btn" onclick="setTab('quiz')">✏️ 퀴즈</button>
      <button class="tab-btn" onclick="setTab('test')">📝 쪽지시험</button>
      <button class="tab-btn" onclick="setTab('edit')">⚙️ 단어 편집</button>
    </div>

    <!-- 단어장 -->
    <div id="tab-dict" class="screen active">
      <div class="card">
        <div id="dict-toolbar">
          <input id="dict-search" type="text" placeholder="검색…" oninput="renderDict()">
          <div class="seg-ctrl">
            <button class="seg-btn active" onclick="setDSeg('all')">전체</button>
            <button class="seg-btn" onclick="setDSeg('wrong')">오답</button>
            <button class="seg-btn" onclick="setDSeg('master')">마스터</button>
            <button class="seg-btn" onclick="setDSeg('fav')">⭐</button>
          </div>
          <button class="btn btn-ghost btn-sm" onclick="exportTxt()">⬇ TXT</button>
        </div>
        <div id="theme-filter"></div>
        <div class="sort-row">
          <label style="font-size:12px;color:var(--sub)">정렬</label>
          <select class="sort-sel" id="sort-key" onchange="renderDict()">
            <option value="addedAt">입력 순</option>
            <option value="kana">히라가나 순</option>
            <option value="meaning">뜻 순</option>
            <option value="quizCount">퀴즈 횟수</option>
            <option value="wrongCount">틀린 횟수</option>
          </select>
          <select class="sort-sel" id="sort-dir" onchange="renderDict()">
            <option value="asc">오름차순</option>
            <option value="desc">내림차순</option>
          </select>
        </div>
        <div class="dict-scroll" id="dict-body"></div>
      </div>
    </div>

    <!-- 플래시카드 -->
    <div id="tab-flash" class="screen">
      <div id="fc-setup" class="card">
        <div class="pool-tabs">
          <button class="ptab active" onclick="setFCPool('all')">전체</button>
          <button class="ptab" onclick="setFCPool('wrong')">오답노트</button>

    function normJP(s) {
      // 문법 표시용 물결(〜)·하이픈(-)은 제거, 가타카나 장음(ー)은 유지
      return String(s || '')
        .replace(/[～〜~]/g, '')      // 물결표 제거 (조사 표시)
        .replace(/^[-‐−]/, '')        // 맨 앞 하이픈 제거 (-じ → じ)

        ch.innerHTML = opts.map(o => `<button class="cbtn" onclick="pickC(this,\`${o.replace(/`/g, '')}\`)">${o}</button>`).join('');
      } else {
        // 주관식
        ai.style.display = 'block'; sb.style.display = 'block';
        ai.placeholder = (mode === 'name2date') ? '날짜 입력 (예: 5/5)' : (ca && /[\u3040-\u30ff]/.test(ca)) ? 'ひらがな 입력' : '입력';
        ai.onkeydown = e => { if (e.key === 'Enter') submitAns(); };
        const mh = { 'kanji2kana': '히라가나로 읽기', 'mean2kana': '히라가나로 입력', 'cnt-input': '히라가나로 입력', 'kana2mean': '뜻을 입력', 'name2date': '날짜를 입력', 'date2name': '기념일 이름 입력', 'geo-kana': '히라가나로 입력', 'chop-kana': '히라가나로 입력' };
        document.getElementById('qmode-hint').textContent = mh[mode] || '입력하세요';
        setTimeout(() => ai.focus(), 50);
      }
    }
    function showHint() { document.getElementById('btn-hint').style.display = 'none'; document.getElementById('hint-kana').style.display = 'block'; document.getElementById('hint-kana').textContent = QS.cur.hint; QS.hint = true; }
    function buildMapSVG() {
      let r = '<svg viewBox="0 0 450 400" style="width:100%;max-width:420px;display:block;margin:0 auto">';
      for (const rg of REGIONS) {
        const m = MAP_REGIONS[rg];
        r += `<g id="map-${rg}" style="cursor:pointer"><rect x="${m.x}" y="${m.y}" width="${m.w}" height="${m.h}" rx="8" fill="#EEF4FF" stroke="#3A7BDE" stroke-width="2"/><text x="${m.x + m.w / 2}" y="${m.y + m.h / 2 + 4}" text-anchor="middle" font-size="13" font-weight="700" fill="#2952A3">${rg}</text></g>`;
      }
      r += '</svg>';
      return r;
    }
    function mapPick(region) {
      if (QS.proc) return; QS.proc = true;
      const ok = region === QS.cur.ca;
      // 색칠
      REGIONS.forEach(rg => {
        const el = document.getElementById('map-' + rg); if (!el) return;
        const rect = el.querySelector('rect');
        if (rg === QS.cur.ca) { rect.setAttribute('fill', '#EAFAF1'); rect.setAttribute('stroke', '#27AE60'); }
        else if (rg === region && !ok) { rect.setAttribute('fill', '#FDEDEC'); rect.setAttribute('stroke', '#E74C3C'); }
        el.onclick = null;
      });
      const fb = document.getElementById('qfeedback');
      fb.textContent = ok ? '⭕ 정답!' : `❌ 정답: ${QS.cur.ca} 지방`; fb.className = ok ? 'ok' : 'ng';
      procResult(ok); QS.idx++; showNextBtn();
    }
    function pickC(btn, chosen) {
      if (QS.proc) return; QS.proc = true;
      document.querySelectorAll('.cbtn').forEach(b => b.disabled = true);
      const ok = chkAns(chosen, QS.cur.ca);
      btn.classList.add(ok ? 'ok' : 'ng');
      if (!ok) document.querySelectorAll('.cbtn').forEach(b => { if (chkAns(b.textContent, QS.cur.ca)) b.classList.add('ok'); });
      const fb = document.getElementById('qfeedback');
      fb.textContent = ok ? '⭕ 정답!' : `❌ 정답: ${QS.cur.ca}`; fb.className = ok ? 'ok' : 'ng';
      procResult(ok); QS.idx++; showNextBtn();
    }
    function submitAns() {
      if (QS.proc) return;
      const ai = document.getElementById('ans-input'), v = ai.value.trim(); if (!v) return;
      QS.proc = true; ai.disabled = true; document.getElementById('submit-btn').disabled = true;
      const ok = (QS.mode === 'name2date') ? chkDate(v, QS.cur.ca) : chkAns(v, QS.cur.ca);
      ai.classList.add(ok ? 'ok' : 'ng');
      const fb = document.getElementById('qfeedback');
      const extra = QS.cur.w.kana !== QS.cur.ca ? `  (${QS.cur.w.kana} / ${QS.cur.w.meaning})` : '';
      fb.textContent = ok ? '⭕ 정답!' + (QS.cur.hint ? ` (${QS.cur.w.kana})` : '') : `❌ 정답: ${QS.cur.ca}${extra}`; fb.className = ok ? 'ok' : 'ng';
      procResult(ok); QS.idx++; showNextBtn();
    }
    function showNextBtn() {
      const w = QS.cur.w;
      const isLast = QS.idx >= QS.words.length;
      const favBtn = `<button id="q-fav-btn" onclick="quizToggleFav(${w.id})" style="background:none;border:1.5px solid var(--gold);border-radius:8px;padding:9px 14px;font-size:13px;cursor:pointer;color:${isFav(w.id) ? '#fff' : 'var(--gold)'};background:${isFav(w.id) ? 'var(--gold)' : 'none'};font-weight:600;font-family:inherit">${isFav(w.id) ? '⭐ 즐겨찾기됨' : '☆ 즐겨찾기'}</button>`;
      document.getElementById('q-next-area').innerHTML = `${favBtn}<button onclick="nextQ()" style="flex:1;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer">${isLast ? '결과 보기 →' : '다음 →'}</button>`;
      document.getElementById('q-next-area').style.display = 'flex';
    }
    function quizToggleFav(id) { toggleFav(id); const b = document.getElementById('q-fav-btn'); if (b) { const f = isFav(id); b.textContent = f ? '⭐ 즐겨찾기됨' : '☆ 즐겨찾기'; b.style.color = f ? '#fff' : 'var(--gold)'; b.style.background = f ? 'var(--gold)' : 'none'; } }
    function procResult(ok) {
      const w = QS.cur.w, mode = QS.mode, k = mkey(w.id, mode);
      const wo = WORDS.find(x => x.id === w.id); if (wo) wo.quizCount++;
      if (ok && !QS.hint) {
        QS.score++;
        // 오답노트 모드에서 맞히면 오답노트에서 제거
        if (QS.isWrong && WSET.has(w.id)) { WSET.delete(w.id); saveWrong(); }
        if (!QS.isWrong) {
          STREAKS[k] = (STREAKS[k] || 0) + 1; saveStreaks();
          if (STREAKS[k] >= MTHRESH && !isMastered(w.id, mode)) { setMastered(w.id, mode); delete STREAKS[k]; saveStreaks(); QS.newM.push({ w, mode }); showMToast(w.kanji || w.kana); }
          // 전체 모드에서도 오답 단어를 맞히면 제거
          if (WSET.has(w.id)) { WSET.delete(w.id); saveWrong(); }
        }
      } else if (!ok || QS.hint) {
        if (!ok && wo) wo.wrongCount++;
        WSET.add(w.id);
        if (!QS.isWrong) { STREAKS[k] = 0; saveStreaks(); }
        WLOG.push({ id: w.id, word: w.kanji || w.kana, ans: QS.cur.ca, date: new Date().toLocaleString('ko-KR') });
        QS.wrongs.push(w); saveWrong();
      }
      saveWords(WORDS); triggerAutoSave();
    }
    function showMToast(word) { const t = document.getElementById('master-toast'); t.textContent = `⭐ "${word}" 마스터!`; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000); }
    function endQuiz() {
      document.getElementById('qscreen').style.display = 'none'; document.getElementById('qresult').style.display = 'block';
      const pct = Math.round(QS.score / QS.words.length * 100);
      document.getElementById('r-score').textContent = `${QS.score} / ${QS.words.length}`;
      document.getElementById('r-sub').textContent = `정답률 ${pct}%  ·  오답 ${QS.wrongs.length}개`;
      document.getElementById('r-master').innerHTML = QS.newM.length ? `<div style="font-size:12px;background:#FFF3CD;border:1px solid var(--gold);border-radius:8px;padding:7px 11px;margin-bottom:8px">⭐ 마스터: ${QS.newM.map(({ w }) => w.kanji || w.kana).join(', ')}</div>` : '';
      document.getElementById('r-wrongs').innerHTML = QS.wrongs.length ? `<div style="font-size:12px;color:var(--accent);margin-bottom:4px">오답 (☆ 눌러 즐겨찾기)</div><div class="wlist">${QS.wrongs.map(w => `<div class="wrow"><button onclick="resultToggleFav(${w.id},this)" style="background:none;border:none;cursor:pointer;font-size:15px;color:${isFav(w.id) ? 'var(--gold)' : '#ccc'}">${isFav(w.id) ? '⭐' : '☆'}</button><span class="wq">${w.kanji || w.kana}</span><span>→ ${w.meaning}</span></div>`).join('')}</div>` : '<div style="text-align:center;color:var(--green);font-size:17px;padding:14px">🎉 오답 없음!</div>';
      updateHdr();
    }
    function backSetup() { document.getElementById('qresult').style.display = 'none'; document.getElementById('qscreen').style.display = 'none'; document.getElementById('qsetup').style.display = 'block'; updatePool(); updateHdr(); }
    function quitQuiz() { if (QS.idx > 0 && !confirm('퀴즈를 중단할까요? 지금까지 기록은 저장됩니다.')) return; backSetup(); }
    function resultToggleFav(id, btn) { toggleFav(id); const f = isFav(id); btn.textContent = f ? '⭐' : '☆'; btn.style.color = f ? 'var(--gold)' : '#ccc'; updateHdr(); }

    // ── 편집 ──
    function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
    let eTheme = '';
    function renderEditThemeFilter() { const el = document.getElementById('edit-theme-filter'); if (!el) return; el.innerHTML = ['전체', ...allThemes()].map(t => `<button class="tchip${(t === '전체' && !eTheme) || (t === eTheme) ? ' active' : ''}" onclick="setETheme('${t === '전체' ? '' : t}')">${t}</button>`).join(''); }
    function setETheme(t) { eTheme = t; renderEdit(); }
    function renderEdit() {
      renderEditThemeFilter();
      const thOpts = allThemes().map(t => `<option value="${esc(t)}">`).join('');
      let list = eTheme ? WORDS.filter(w => (w.theme || '기타') === eTheme) : [...WORDS];
      document.getElementById('edit-count').textContent = `${list.length}개 표시 (전체 ${WORDS.length}개)`;
      const rows = list.map(w => `<tr data-id="${w.id}"><td><input class="einp" data-f="kanji" value="${esc(w.kanji)}"></td><td><input class="einp" data-f="kana" value="${esc(w.kana)}"></td><td><input class="einp" data-f="meaning" value="${esc(w.meaning)}"></td><td><input class="einp" data-f="date" value="${esc(w.date || '')}"></td><td><input class="einp" data-f="note" value="${esc(w.note || '')}"></td><td><input class="einp" data-f="theme" value="${esc(w.theme || '기타')}" list="edit-tdl"></td><td><button class="btn-del" onclick="delWord(${w.id})">✕</button></td></tr>`).join('');
      document.getElementById('edit-body').innerHTML = `<datalist id="edit-tdl">${thOpts}</datalist><table class="etbl"><thead><tr><th>한자</th><th>가나*</th><th>뜻*</th><th>날짜</th><th>설명</th><th>분야</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
    }
    function collectEdits(skipId) {
      const rows = document.querySelectorAll('#edit-body tbody tr'); const ids = new Set(); const upd = [];
      rows.forEach(row => { const id = parseInt(row.dataset.id); if (id === skipId) return; const g = f => (row.querySelector(`[data-f="${f}"]`).value || '').trim(); const kana = g('kana'), mean = g('meaning'); if (!kana || !mean) return; const o = WORDS.find(w => w.id === id) || { quizCount: 0, wrongCount: 0, addedAt: id }; upd.push({ ...o, id, kanji: g('kanji'), kana, meaning: mean, date: g('date'), note: g('note'), theme: g('theme') || '기타' }); ids.add(id); });
      return { ids, upd };
    }
    function addWord() {
      const g = id => (document.getElementById(id).value || '').trim();
      const kanji = g('add-kanji'), kana = g('add-kana'), mean = g('add-mean'), date = g('add-date'), note = g('add-note'), theme = g('add-theme') || '기타';
      if (!kana || !mean) { alert('히라가나와 뜻은 필수예요.'); return; }
      const { ids, upd } = collectEdits();
      const kept = WORDS.filter(w => !ids.has(w.id));
      WORDS = [...kept, ...upd].sort((a, b) => a.addedAt - b.addedAt);
      const newId = Math.max(0, ...WORDS.map(w => w.id)) + 1;
      WORDS.push({ id: newId, kanji, kana, meaning: mean, date, note, theme, addedAt: newId, quizCount: 0, wrongCount: 0 });
      saveWords(WORDS);
      ['add-kanji', 'add-kana', 'add-mean', 'add-date', 'add-note', 'add-theme'].forEach(id => document.getElementById(id).value = '');
      renderEdit(); renderThemeFilter(); updateHdr(); triggerAutoSave();
    }
    function delWord(id) {
      if (!confirm('삭제할까요?')) return;
      const { ids, upd } = collectEdits(id);
      const kept = WORDS.filter(w => !ids.has(w.id) && w.id !== id);
      WORDS = [...kept, ...upd].sort((a, b) => a.addedAt - b.addedAt);
      Object.keys(MMAP).filter(k => k.startsWith(id + '_')).forEach(k => delete MMAP[k]);
      WSET.delete(id); saveMaster(); saveWrong(); saveWords(WORDS); renderEdit(); updateHdr();
    }
    function saveEdits() {
      const { ids, upd } = collectEdits();
      const kept = WORDS.filter(w => !ids.has(w.id));
      WORDS = [...kept, ...upd].sort((a, b) => a.addedAt - b.addedAt);
      saveWords(WORDS); updateHdr(); renderDict(); renderEdit(); triggerAutoSave(); alert('저장됐어요!');
    }
    function openThemeMgr() { renderThemeMgrList(); document.getElementById('theme-modal').style.display = 'flex'; }
    function closeThemeMgr() { document.getElementById('theme-modal').style.display = 'none'; }
    function renderThemeMgrList() { const themes = allThemes(), cnt = {}; WORDS.forEach(w => { const t = w.theme || '기타'; cnt[t] = (cnt[t] || 0) + 1; }); document.getElementById('theme-mgr-list').innerHTML = themes.map(t => `<div style="display:flex;align-items:center;gap:7px;padding:6px 0;border-bottom:1px solid var(--border)"><span style="flex:1;font-size:13px">${esc(t)} <span style="color:var(--sub);font-size:11px">(${cnt[t] || 0})</span></span><input id="rn-${esc(t)}" value="${esc(t)}" style="width:110px;padding:4px 7px;border:1.5px solid var(--border);border-radius:5px;font-size:12px;font-family:inherit"><button class="btn btn-blue btn-sm" onclick="renameTheme('${esc(t)}')">변경</button></div>`).join(''); }
    function renameTheme(old) { const nw = (document.getElementById('rn-' + old)?.value || '').trim(); if (!nw || nw === old) return; WORDS.forEach(w => { if ((w.theme || '기타') === old) w.theme = nw; }); saveWords(WORDS); renderThemeMgrList(); renderThemeFilter(); renderDict(); }
    function addTheme() { const n = (document.getElementById('new-theme')?.value || '').trim(); if (!n) { alert('분야명 입력'); return; } document.getElementById('new-theme').value = ''; alert(`"${n}" 추가됨. 편집에서 단어에 지정하세요.`); closeThemeMgr(); }

    // ── 구글 드라이브 ──
    const G_CID = '793628569220-1mdvotl8t7a2sc2ar8a2cs5ag3te7n6u.apps.googleusercontent.com';
    const G_SCOPE = 'https://www.googleapis.com/auth/drive.file';
    const G_FILE = 'japanese_vocab_save.json';
    let gToken = null, gFileId = null, gisOk = false, gTC = null, autoT = null;
    function triggerAutoSave() { if (!gToken) return; clearTimeout(autoT); autoT = setTimeout(() => { setSt('💾 자동 저장 중…'); gSave(true); }, 30000); }
    window.addEventListener('beforeunload', () => { if (!gToken || !gFileId) return; const j = JSON.stringify(buildSave()); navigator.sendBeacon(`https://www.googleapis.com/upload/drive/v3/files/${gFileId}?uploadType=media`, new Blob([j], { type: 'application/json' })); });
    function buildSave() { return { version: 3, savedAt: new Date().toISOString(), words: WORDS, masterMap: MMAP, wrongSet: [...WSET], wrongLog: WLOG, streaks: STREAKS, favSet: [...FAVSET] }; }
    window.gisLoaded = function () { gTC = google.accounts.oauth2.initTokenClient({ client_id: G_CID, scope: G_SCOPE, callback: async r => { if (r.error) { setSt('❌ 로그인 실패'); return; } gToken = r.access_token; showDrive(); setSt('✅ 로그인됨'); await findFile(); } }); gisOk = true; document.getElementById('btn-login').style.display = 'inline-block'; }
    function showDrive() { document.getElementById('btn-login').style.display = 'none'; document.getElementById('btn-save').style.display = 'inline-block'; document.getElementById('btn-load').style.display = 'inline-block'; }
    function setSt(m) { document.getElementById('drive-st').textContent = m; }
    function gLogin() { if (!gisOk) { setSt('API 로딩 중…'); return; } gTC.requestAccessToken({ prompt: 'consent' }); }
    async function findFile() { try { const query = encodeURIComponent(`name='${G_FILE}' and trashed=false`); const r = await fetch(`https://www.googleapis.com/drive/v3/files?q=${query}&fields=files(id,name)&spaces=drive`, { headers: { 'Authorization': 'Bearer ' + gToken } }); const data = await r.json(); const f = data.files; if (f && f.length > 0) { gFileId = f[0].id; setSt('✅ 로그인됨 (저장 파일 있음)'); } else setSt('✅ 로그인됨'); } catch (e) { setSt('파일 검색 오류'); } }
    async function gSave(silent) { if (!gToken) { setSt('먼저 로그인'); return; } if (!silent) setSt('저장 중…'); try { const json = JSON.stringify(buildSave()); if (gFileId) { await fetch(`https://www.googleapis.com/upload/drive/v3/files/${gFileId}?uploadType=media`, { method: 'PATCH', headers: { 'Authorization': 'Bearer ' + gToken, 'Content-Type': 'application/json' }, body: json }); } else { const form = new FormData(); form.append('metadata', new Blob([JSON.stringify({ name: G_FILE, mimeType: 'application/json' })], { type: 'application/json' })); form.append('file', new Blob([json], { type: 'application/json' })); const r = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', { method: 'POST', headers: { 'Authorization': 'Bearer ' + gToken }, body: form }); gFileId = (await r.json()).id; } setSt('☁️ ' + (silent ? '자동 ' : '') + '저장 완료 (' + new Date().toLocaleTimeString('ko-KR') + ')'); } catch (e) { setSt('저장 오류: ' + e.message); } }
    async function gLoad() { if (!gToken) { setSt('먼저 로그인'); return; } if (!gFileId) await findFile(); if (!gFileId) { setSt('저장 파일 없음'); return; } setSt('불러오는 중…'); try { const r = await fetch(`https://www.googleapis.com/drive/v3/files/${gFileId}?alt=media`, { headers: { 'Authorization': 'Bearer ' + gToken } }); const d = await r.json(); if (!d || (d.version !== 2 && d.version !== 3)) { alert('형식 오류'); return; } if (!confirm('현재 데이터를 덮어씁니다. 계속?')) return; WORDS = d.words || WORDS; MMAP = d.masterMap || {}; WSET = new Set(d.wrongSet || []); WLOG = d.wrongLog || []; STREAKS = d.streaks || {}; FAVSET = new Set(d.favSet || []); saveWords(WORDS); saveMaster(); saveWrong(); saveStreaks(); saveFav(); init(); setSt('📂 불러오기 완료!'); } catch (e) { setSt('불러오기 오류: ' + e.message); } }

    function init() {
      WORDS = loadWords(); MMAP = JSON.parse(localStorage.getItem(SK_MASTER) || '{}'); WSET = new Set(JSON.parse(localStorage.getItem(SK_WRONG) || '[]')); WLOG = JSON.parse(localStorage.getItem(SK_WLOG) || '[]'); STREAKS = JSON.parse(localStorage.getItem(SK_STREAKS) || '{}'); FAVSET = new Set(JSON.parse(localStorage.getItem(SK_FAV) || '[]'));
      updateHdr(); renderThemeFilter(); renderDict(); renderTypeTabs(); renderModeTabs(); renderQThemeFilter(); updatePool(); renderFCThemeFilter(); updateFCPool();
      if (window.speechSynthesis) window.speechSynthesis.getVoices();
    }
    init();
    if (window.google && window.google.accounts) {
      gisLoaded();
    }
  </script>
  <script async defer src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>
