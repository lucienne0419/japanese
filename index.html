<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日本語 単語帳</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+KR:wght@400;600;700&display=swap');
:root{
  --bg:#F4F3EF;--card:#fff;--ink:#1A1A2E;--sub:#6B7280;
  --accent:#D94F3D;--blue:#3A7BDE;--green:#27AE60;--wrong:#E74C3C;
  --border:#E5E7EB;--radius:12px;--gold:#F5A623;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);font-family:'Noto Sans KR','Noto Sans JP',sans-serif;color:var(--ink);min-height:100vh;}

/* ── 레이아웃 ── */
#header{position:sticky;top:0;z-index:100;background:var(--ink);color:#fff;padding:12px 20px;}
#header-top{display:flex;align-items:center;gap:14px;margin-bottom:8px;}
.logo{font-size:20px;font-weight:700;letter-spacing:-0.5px;}
.logo span{color:var(--accent);}
#header-stats{display:flex;gap:10px;flex-wrap:wrap;}
.stat-chip{background:rgba(255,255,255,.12);border-radius:99px;padding:4px 12px;font-size:12px;display:flex;align-items:center;gap:5px;cursor:default;}
.stat-chip b{font-size:13px;}
#recent-wrong{font-size:11px;color:rgba(255,255,255,.55);margin-top:4px;min-height:16px;}

#main{max-width:780px;margin:0 auto;padding:18px 16px;}

/* ── 탭 ── */
#tab-nav{display:flex;gap:6px;margin-bottom:16px;}
.tab-btn{padding:9px 18px;border:none;border-radius:99px;background:var(--card);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;color:var(--sub);border:1.5px solid var(--border);transition:all .15s;}
.tab-btn:hover{border-color:var(--blue);color:var(--blue);}
.tab-btn.active{background:var(--ink);border-color:var(--ink);color:#fff;}

.card{background:var(--card);border-radius:var(--radius);padding:22px 20px;box-shadow:0 1px 8px rgba(0,0,0,.06);margin-bottom:14px;}

/* ── 공통 버튼 ── */
.btn{border:none;border-radius:8px;cursor:pointer;font-family:inherit;font-weight:600;transition:opacity .15s;}
.btn:hover{opacity:.85;}
.btn-primary{background:var(--accent);color:#fff;padding:11px 22px;font-size:14px;}
.btn-blue{background:var(--blue);color:#fff;padding:9px 18px;font-size:13px;}
.btn-ghost{background:var(--border);color:var(--sub);padding:9px 16px;font-size:13px;}
.btn-danger{background:#FEE2E2;color:var(--wrong);padding:7px 14px;font-size:12px;}
.btn-sm{padding:6px 12px;font-size:12px;}
.btn-icon{background:none;border:1.5px solid var(--border);border-radius:7px;padding:5px 10px;font-size:12px;cursor:pointer;color:var(--sub);}
.btn-icon:hover{border-color:var(--blue);color:var(--blue);}

/* ── 단어장 ── */
#dict-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;}
#dict-search{flex:1;min-width:140px;padding:8px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;}
#dict-search:focus{outline:none;border-color:var(--blue);}
.seg-ctrl{display:flex;border:1.5px solid var(--border);border-radius:8px;overflow:hidden;}
.seg-btn{padding:7px 13px;border:none;background:#fff;font-size:12px;font-family:inherit;cursor:pointer;color:var(--sub);}
.seg-btn.active{background:var(--ink);color:#fff;font-weight:700;}
.sort-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px;}
.sort-row label{font-size:12px;color:var(--sub);}
.sort-sel{padding:5px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:12px;font-family:inherit;}
.sort-sel:focus{outline:none;border-color:var(--blue);}

.dict-table{width:100%;border-collapse:collapse;font-size:13px;}
.dict-table th{background:#F8F9FA;padding:8px 10px;text-align:left;font-size:11px;color:var(--sub);font-weight:700;letter-spacing:.5px;border-bottom:2px solid var(--border);white-space:nowrap;}
.dict-table td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
.dict-table tr:last-child td{border-bottom:none;}
.dict-table tr:hover td{background:#FAFBFC;}
.dict-scroll{max-height:500px;overflow-y:auto;border:1px solid var(--border);border-radius:10px;}
.tag-master{font-size:10px;background:#FFF3CD;color:#856404;border:1px solid #FFD700;border-radius:99px;padding:2px 7px;font-weight:700;}
.tag-wrong{font-size:10px;background:#FEE2E2;color:var(--wrong);border:1px solid #FCA5A5;border-radius:99px;padding:2px 7px;font-weight:700;}
.kana-cell{font-family:'Noto Sans JP',sans-serif;}

/* ── 퀴즈 설정 ── */
.quiz-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
@media(max-width:500px){.quiz-grid{grid-template-columns:1fr;}}
.mode-card{border:2px solid var(--border);border-radius:10px;padding:12px 14px;cursor:pointer;transition:all .15s;}
.mode-card:hover{border-color:var(--blue);}
.mode-card.selected{border-color:var(--blue);background:#EEF4FF;}
.mode-card input{display:none;}
.mode-title{font-size:13px;font-weight:700;margin-bottom:2px;}
.mode-desc{font-size:11px;color:var(--sub);}
.quiz-opt-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;}
.quiz-opt-row label{font-size:13px;color:var(--sub);}
#quiz-n{width:70px;padding:7px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;text-align:center;}
.pool-tabs{display:flex;gap:6px;margin-bottom:12px;}
.pool-tab{padding:7px 14px;border:1.5px solid var(--border);border-radius:8px;background:#fff;font-size:13px;cursor:pointer;color:var(--sub);font-family:inherit;transition:all .15s;}
.pool-tab.active{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700;}

/* ── 퀴즈 화면 ── */
#quiz-screen{display:none;}
.q-progress{margin-bottom:14px;}
.q-prog-bar{height:5px;background:var(--border);border-radius:99px;overflow:hidden;margin-bottom:5px;}
.q-prog-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .3s;}
.q-prog-text{font-size:11px;color:var(--sub);text-align:right;}
.q-streak{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--sub);min-height:20px;margin-bottom:6px;flex-wrap:wrap;}
.s-dot{width:10px;height:10px;border-radius:50%;background:var(--border);}
.s-dot.on{background:var(--green);}
.q-word{font-size:52px;font-weight:700;text-align:center;padding:24px 10px 8px;line-height:1.2;word-break:break-all;}
.q-hint-area{text-align:center;min-height:26px;margin-bottom:12px;}
.q-hint-kana{font-family:'Noto Sans JP',sans-serif;font-size:18px;color:var(--sub);display:none;}
.btn-hint{background:#FFF9E6;border:1.5px solid var(--gold);color:#92640A;border-radius:8px;padding:5px 14px;font-size:12px;font-weight:700;cursor:pointer;}
.q-mode-hint{text-align:center;font-size:12px;color:var(--sub);margin-bottom:16px;}
.choices{display:flex;flex-direction:column;gap:8px;}
.c-btn{padding:13px 16px;border:1.5px solid var(--border);border-radius:10px;background:#FAFAFA;font-size:14px;font-family:inherit;text-align:left;cursor:pointer;transition:all .12s;}
.c-btn:hover:not(:disabled){border-color:var(--blue);background:#EEF4FF;}
.c-btn.ok{border-color:var(--green);background:#EAFAF1;color:#1E8449;}
.c-btn.ng{border-color:var(--wrong);background:#FDEDEC;color:#922B21;}
#ans-input{width:100%;padding:13px 16px;border:1.5px solid var(--border);border-radius:10px;font-size:16px;font-family:'Noto Sans JP','Noto Sans KR',sans-serif;text-align:center;margin-bottom:10px;transition:border-color .15s;}
#ans-input:focus{outline:none;border-color:var(--blue);}
#ans-input.ok{border-color:var(--green);background:#EAFAF1;}
#ans-input.ng{border-color:var(--wrong);background:#FDEDEC;}
#submit-btn{width:100%;padding:12px;background:var(--blue);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;}
#q-feedback{min-height:26px;margin-top:12px;text-align:center;font-size:14px;font-weight:600;}
#q-feedback.ok{color:var(--green);}
#q-feedback.ng{color:var(--wrong);}
#master-toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#212529;color:var(--gold);font-size:13px;font-weight:700;padding:9px 22px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:999;}
#master-toast.show{opacity:1;}

/* ── 결과 ── */
.result-big{text-align:center;font-size:58px;font-weight:700;color:var(--blue);padding:8px 0;}
.result-sub{text-align:center;font-size:14px;color:var(--sub);margin-bottom:18px;}
.wrong-list{background:#FFF8F8;border:1px solid #FDD;border-radius:10px;padding:12px 14px;max-height:220px;overflow-y:auto;font-size:13px;}
.wr-row{display:flex;gap:10px;padding:4px 0;border-bottom:1px solid #FFE4E4;}
.wr-row:last-child{border-bottom:none;}
.wr-q{color:var(--wrong);font-weight:700;min-width:110px;}
.res-btns{display:flex;gap:8px;margin-top:16px;}
.res-btns .btn{flex:1;padding:11px 0;font-size:13px;}

/* ── 편집 ── */
.edit-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center;}
.edit-table{width:100%;border-collapse:collapse;font-size:13px;}
.edit-table th{background:#F8F9FA;padding:8px 10px;font-size:11px;color:var(--sub);font-weight:700;text-align:left;border-bottom:2px solid var(--border);}
.edit-table td{padding:5px 8px;border-bottom:1px solid var(--border);}
.edit-table tr:last-child td{border-bottom:none;}
.e-inp{width:100%;padding:5px 8px;border:1.5px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;}
.e-inp:focus{outline:none;border-color:var(--blue);}
.btn-del{background:#FEE2E2;color:var(--wrong);border:none;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;}
.e-scroll{max-height:420px;overflow-y:auto;border:1px solid var(--border);border-radius:10px;margin-bottom:12px;}
.add-row{display:flex;gap:7px;margin-bottom:10px;flex-wrap:wrap;}
.add-row input{flex:1;min-width:90px;padding:8px 11px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;}
.add-row input:focus{outline:none;border-color:var(--blue);}

/* ── 스크롤 ── */
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-thumb{background:#ccc;border-radius:99px;}

/* ── 화면 ── */
.screen{display:none;}
.screen.active{display:block;}
</style>
</head>
<body>

<!-- ════ 고정 헤더 ════ -->
<div id="header">
  <div id="header-top">
    <div class="logo">日<span>本語</span> 単語帳</div>
    <div id="header-stats">
      <div class="stat-chip">📚 총 <b id="h-total">0</b>개</div>
      <div class="stat-chip">⭐ 마스터 <b id="h-master">0</b>개</div>
      <div class="stat-chip">❌ 오답 <b id="h-wrong">0</b>개</div>
    </div>
  </div>
  <div id="recent-wrong">최근 틀린 단어: 없음</div>
</div>

<div id="main">
  <!-- 탭 -->
  <div id="tab-nav">
    <button class="tab-btn active" onclick="setTab('dict')">📖 단어장</button>
    <button class="tab-btn" onclick="setTab('quiz')">📝 퀴즈</button>
    <button class="tab-btn" onclick="setTab('edit')">✏️ 단어 편집</button>
  </div>

  <!-- ════ 단어장 탭 ════ -->
  <div id="tab-dict" class="screen active">
    <div class="card">
      <div id="dict-toolbar">
        <input id="dict-search" type="text" placeholder="검색 (일본어·한국어)…" oninput="renderDict()">
        <div class="seg-ctrl" id="dict-seg">
          <button class="seg-btn active" onclick="setDictSeg('all')">전체</button>
          <button class="seg-btn" onclick="setDictSeg('wrong')">오답</button>
          <button class="seg-btn" onclick="setDictSeg('master')">마스터</button>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="exportTxt()">⬇ TXT 내보내기</button>
      </div>
      <div class="sort-row">
        <label>정렬</label>
        <select class="sort-sel" id="sort-key" onchange="renderDict()">
          <option value="addedAt">입력 순</option>
          <option value="kana">히라가나 순</option>
          <option value="meaning">뜻(한글) 순</option>
          <option value="quizCount">퀴즈 횟수 순</option>
          <option value="wrongCount">틀린 횟수 순</option>
        </select>
        <select class="sort-sel" id="sort-dir" onchange="renderDict()">
          <option value="asc">오름차순</option>
          <option value="desc">내림차순</option>
        </select>
      </div>
      <div class="dict-scroll" id="dict-body"></div>
    </div>
  </div>

  <!-- ════ 퀴즈 탭 ════ -->
  <div id="tab-quiz" class="screen">
    <div id="quiz-setup" class="card">
      <div style="margin-bottom:12px">
        <div class="pool-tabs">
          <button class="pool-tab active" onclick="setQuizPool('all')">전체</button>
          <button class="pool-tab" onclick="setQuizPool('wrong')">오답노트</button>
        </div>
        <div id="quiz-pool-info" style="font-size:12px;color:var(--sub);margin-bottom:10px;"></div>
      </div>
      <div class="quiz-opt-row">
        <label>문제 수</label>
        <input id="quiz-n" type="number" value="20" min="1">
        <span id="quiz-n-max" style="font-size:12px;color:var(--sub);"></span>
      </div>
      <div style="margin-bottom:10px;font-size:11px;color:var(--sub);">퀴즈 모드 선택</div>
      <div class="quiz-grid" id="mode-cards"></div>
      <div id="master-notice" style="font-size:12px;background:#FFFBEA;border:1px solid var(--gold);border-radius:8px;padding:8px 12px;margin-bottom:12px;display:none;">
        ⭐ 전체 퀴즈 기준 — 3회 누적 정답 시 마스터 처리, 이후 출제 제외
      </div>
      <button class="btn btn-primary" style="width:100%" onclick="startQuiz()">퀴즈 시작 →</button>
    </div>

    <!-- 퀴즈 진행 -->
    <div id="quiz-screen">
      <div id="master-toast">⭐ 마스터!</div>
      <div class="card">
        <div class="q-progress">
          <div class="q-prog-bar"><div class="q-prog-fill" id="q-fill" style="width:0%"></div></div>
          <div class="q-prog-text" id="q-prog-text">0 / 0</div>
        </div>
        <div class="q-streak" id="q-streak"></div>
        <div class="q-word" id="q-word">—</div>
        <div class="q-hint-area">
          <button class="btn-hint" id="btn-hint" onclick="showHint()" style="display:none">💡 가나 힌트</button>
          <div class="q-hint-kana" id="q-hint-kana"></div>
        </div>
        <div class="q-mode-hint" id="q-mode-hint"></div>
        <div id="q-choices"></div>
        <input id="ans-input" type="text" autocomplete="off" autocorrect="off" spellcheck="false" style="display:none">
        <button id="submit-btn" onclick="submitAns()" style="display:none">제출하기</button>
        <div id="q-feedback"></div>
      </div>
    </div>

    <!-- 결과 -->
    <div id="quiz-result" style="display:none;">
      <div class="card">
        <div style="text-align:center;font-size:11px;letter-spacing:1px;color:var(--sub);margin-bottom:4px;">QUIZ RESULT</div>
        <div class="result-big" id="r-score">—</div>
        <div class="result-sub" id="r-sub"></div>
        <div id="r-master"></div>
        <div id="r-wrongs"></div>
        <div class="res-btns">
          <button class="btn btn-ghost" onclick="backToSetup()">← 설정으로</button>
          <button class="btn btn-primary" onclick="startQuiz()">다시 풀기</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ════ 편집 탭 ════ -->
  <div id="tab-edit" class="screen">
    <div class="card">
      <div class="edit-toolbar">
        <div style="font-size:13px;font-weight:700;">단어 추가</div>
      </div>
      <div class="add-row">
        <input id="add-kanji" placeholder="한자 (없으면 빈칸)">
        <input id="add-kana"  placeholder="히라가나 *필수">
        <input id="add-mean"  placeholder="한국어 뜻 *필수">
        <input id="add-note"  placeholder="부가설명 (선택)">
        <button class="btn btn-blue" onclick="addWord()">+ 추가</button>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <div style="font-size:13px;font-weight:700;">단어 목록 편집</div>
        <div style="display:flex;gap:6px;">
          <button class="btn btn-blue btn-sm" onclick="saveEdits()">💾 저장</button>
          <button class="btn btn-danger btn-sm" onclick="resetToDefault()">초기화</button>
        </div>
      </div>
      <div class="e-scroll" id="edit-body"></div>
      <p style="font-size:11px;color:var(--sub);margin-top:6px;text-align:center;">변경 후 반드시 저장 버튼을 눌러주세요</p>
    </div>
  </div>
</div>

<script>
const BASE_WORDS = [
  {id:1,kanji:"",kana:"いちじ",meaning:"1시",addedAt:1,quizCount:0,wrongCount:0,streak:0},
  {id:2,kanji:"",kana:"にじ",meaning:"2시",addedAt:2,quizCount:0,wrongCount:0,streak:0},
  {id:3,kanji:"",kana:"さんじ",meaning:"3시",addedAt:3,quizCount:0,wrongCount:0,streak:0},
  {id:4,kanji:"",kana:"よじ",meaning:"4시",addedAt:4,quizCount:0,wrongCount:0,streak:0},
  {id:5,kanji:"",kana:"ごじ",meaning:"5시",addedAt:5,quizCount:0,wrongCount:0,streak:0},
  {id:6,kanji:"",kana:"ろくじ",meaning:"6시",addedAt:6,quizCount:0,wrongCount:0,streak:0},
  {id:7,kanji:"",kana:"しちじ",meaning:"7시",addedAt:7,quizCount:0,wrongCount:0,streak:0},
  {id:8,kanji:"",kana:"はちじ",meaning:"8시",addedAt:8,quizCount:0,wrongCount:0,streak:0},
  {id:9,kanji:"",kana:"くじ",meaning:"9시",addedAt:9,quizCount:0,wrongCount:0,streak:0},
  {id:10,kanji:"",kana:"じゅうじ",meaning:"10시",addedAt:10,quizCount:0,wrongCount:0,streak:0},
  {id:11,kanji:"",kana:"じゅういちじ",meaning:"11시",addedAt:11,quizCount:0,wrongCount:0,streak:0},
  {id:12,kanji:"",kana:"じゅうにじ",meaning:"12시",addedAt:12,quizCount:0,wrongCount:0,streak:0},
  {id:13,kanji:"",kana:"なんじ",meaning:"몇 시",addedAt:13,quizCount:0,wrongCount:0,streak:0},
  {id:14,kanji:"",kana:"いっぷん",meaning:"1분",addedAt:14,quizCount:0,wrongCount:0,streak:0},
  {id:15,kanji:"",kana:"にふん",meaning:"2분",addedAt:15,quizCount:0,wrongCount:0,streak:0},
  {id:16,kanji:"",kana:"さんぷん",meaning:"3분",addedAt:16,quizCount:0,wrongCount:0,streak:0},
  {id:17,kanji:"",kana:"よんぷん",meaning:"4분",addedAt:17,quizCount:0,wrongCount:0,streak:0},
  {id:18,kanji:"",kana:"ごふん",meaning:"5분",addedAt:18,quizCount:0,wrongCount:0,streak:0},
  {id:19,kanji:"",kana:"ろっぷん",meaning:"6분",addedAt:19,quizCount:0,wrongCount:0,streak:0},
  {id:20,kanji:"",kana:"ななふん",meaning:"7분",addedAt:20,quizCount:0,wrongCount:0,streak:0},
  {id:21,kanji:"",kana:"はっぷん／はちふん",meaning:"8분",addedAt:21,quizCount:0,wrongCount:0,streak:0},
  {id:22,kanji:"",kana:"きゅうふん",meaning:"9분",addedAt:22,quizCount:0,wrongCount:0,streak:0},
  {id:23,kanji:"",kana:"じっぷん／じゅっぷん",meaning:"10분",addedAt:23,quizCount:0,wrongCount:0,streak:0},
  {id:24,kanji:"",kana:"じゅうごふん",meaning:"15분",addedAt:24,quizCount:0,wrongCount:0,streak:0},

function loadWords(){

    const s=localStorage.getItem(SK_WORDS);
    if(s) return JSON.parse(s);
  }catch{}
  return JSON.parse(JSON.stringify(BASE_WORDS));
}

function resetToDefault(){
  if(!confirm('모든 단어를 기본값으로 초기화할까요? (퀴즈 기록도 삭제됩니다)')) return;
  localStorage.removeItem(SK_WORDS);

let WORDS      = loadWords();
let MASTER_MAP = JSON.parse(localStorage.getItem(SK_MASTER)||'{}'); // {wordId_mode: true}
let WRONG_SET  = new Set(JSON.parse(localStorage.getItem(SK_WRONG)||'[]'));
let WRONG_LOG  = JSON.parse(localStorage.getItem(SK_WRONG_LOG)||'[]');
let STREAKS    = JSON.parse(localStorage.getItem(SK_STREAKS)||'{}'); // {wordId_mode: count}

// 모드별 마스터 헬퍼
function mkey(id,mode){ return id+'_'+mode; }
function isMastered(id,mode){ return !!MASTER_MAP[mkey(id,mode)]; }
function setMastered(id,mode){ MASTER_MAP[mkey(id,mode)]=true; saveMaster(); }
function totalMastered(){ return new Set(Object.keys(MASTER_MAP).map(k=>k.split('_')[0])).size; }
// 단어 id가 모든 모드에서 마스터됐는지 (단어장 표시용) — 1개라도 마스터면 표시
function isAnyMastered(id){ return Object.keys(MASTER_MAP).some(k=>k.startsWith(id+'_')); }

function saveMaster(){ localStorage.setItem(SK_MASTER,JSON.stringify(MASTER_MAP)); }
function saveWrong(){
  localStorage.setItem(SK_WRONG,JSON.stringify([...WRONG_SET]));
  localStorage.setItem(SK_WRONG_LOG,JSON.stringify(WRONG_LOG));
}
function saveStreaks(){ localStorage.setItem(SK_STREAKS,JSON.stringify(STREAKS)); }

function getWord(id){ return WORDS.find(w=>w.id===id); }

//  로마자 변환
// ══════════════════════════════════════════════
const ROMAJI={
  'あ':'a','い':'i','う':'u','え':'e','お':'o','か':'ka','き':'ki','く':'ku','け':'ke','こ':'ko',
  'さ':'sa','し':'shi','す':'su','せ':'se','そ':'so','た':'ta','ち':'chi','つ':'tsu','て':'te','と':'to',
  'な':'na','に':'ni','ぬ':'nu','ね':'ne','の':'no','は':'ha','ひ':'hi','ふ':'fu','へ':'he','ほ':'ho',
  'ま':'ma','み':'mi','む':'mu','め':'me','も':'mo','や':'ya','ゆ':'yu','よ':'yo',
  'ら':'ra','り':'ri','る':'ru','れ':'re','ろ':'ro','わ':'wa','を':'wo','ん':'n',
  'が':'ga','ぎ':'gi','ぐ':'gu','げ':'ge','ご':'go','ざ':'za','じ':'ji','ず':'zu','ぜ':'ze','ぞ':'zo',
  'だ':'da','で':'de','ど':'do','ば':'ba','び':'bi','ぶ':'bu','べ':'be','ぼ':'bo',
  'ぱ':'pa','ぴ':'pi','ぷ':'pu','ぺ':'pe','ぽ':'po',
  'きゃ':'kya','きゅ':'kyu','きょ':'kyo','しゃ':'sha','しゅ':'shu','しょ':'sho',
  'ちゃ':'cha','ちゅ':'chu','ちょ':'cho','にゃ':'nya','にゅ':'nyu','にょ':'nyo',
  'ひゃ':'hya','みゃ':'mya','みゅ':'myu','みょ':'myo','りゃ':'rya','りゅ':'ryu','りょ':'ryo',
  'ぎゃ':'gya','ぎゅ':'gyu','ぎょ':'gyo','じゃ':'ja','じゅ':'ju','じょ':'jo',
  'びゃ':'bya','びゅ':'byu','びょ':'byo','ぴゃ':'pya','ぴゅ':'pyu','ぴょ':'pyo',
};
function kataToHira(s){ return s.split('').map(c=>{const n=c.charCodeAt(0);return(n>=0x30A1&&n<=0x30F6)?String.fromCharCode(n-0x60):c}).join(''); }
function toRomaji(kana){
  const h=kataToHira(kana); let r='',i=0;
  while(i<h.length){
    if(i+1<h.length&&ROMAJI[h[i]+h[i+1]]){r+=ROMAJI[h[i]+h[i+1]];i+=2;}
    else if(h[i]==='っ'&&i+1<h.length){r+=(ROMAJI[h[i+1]]||'')[0]||'';i++;}
    else if(h[i]==='ー'){i++;}
    else{r+=ROMAJI[h[i]]||h[i];i++;}
  }
  return r;
}
function romajiMatch(input,kana){
  const u=input.toLowerCase().replace(/\s/g,'');
  return kana.split('／').some(t=>{
    const r=toRomaji(kataToHira(t.split('/')[0]));
    return u===r||u===r.replace(/sh/g,'s').replace(/ch/g,'t');
  });
}
function checkAns(input,correct){
  // 공백 완전 무시, 소문자 통일
  const u=input.replace(/\s/g,'').toLowerCase();
  if(!u)return false;
  // /와 ／ 둘 다 구분자로 처리
  const parts=correct.split(/[\/／]/);
  return parts.some(p=>{
    const a=p.replace(/\s/g,'').toLowerCase();
    if(u===a)return true;
    // 괄호 안 제거 후 비교
    const base=a.replace(/\(.*?\)/g,'').replace(/（.*?）/g,'').trim();
    return base!==''&&u===base;
  });
}

let dictSeg='all';
function setDictSeg(s){
  dictSeg=s;
  document.querySelectorAll('#dict-seg .seg-btn').forEach((b,i)=>b.classList.toggle('active',['all','wrong','master'][i]===s));
  renderDict();
}

function renderDict(){
  const q=(document.getElementById('dict-search').value||'').toLowerCase();
  const key=document.getElementById('sort-key').value;
  const dir=document.getElementById('sort-dir').value;

  let list=[...WORDS];
  if(dictSeg==='wrong')  list=list.filter(w=>WRONG_SET.has(w.id));
  if(dictSeg==='master') list=list.filter(w=>isAnyMastered(w.id));
  if(q) list=list.filter(w=>(w.kanji+w.kana+w.meaning).toLowerCase().includes(q));

  list.sort((a,b)=>{
    let va=a[key], vb=b[key];
    if(typeof va==='string') va=va.localeCompare(vb, 'ja');
    else va=va-vb;
    return dir==='asc'?va:-va;
  });

  if(!list.length){
    document.getElementById('dict-body').innerHTML='<div style="padding:24px;text-align:center;color:var(--sub);font-size:14px;">단어 없음</div>';
    return;
  }
  const rows=list.map(w=>{
    const tags=(isAnyMastered(w.id)?'<span class="tag-master">⭐마스터</span>':'')+
               (WRONG_SET.has(w.id)?'<span class="tag-wrong">오답</span>':'');
    return `<tr>
      <td style="font-size:15px;font-weight:700;">${w.kanji||'—'}</td>
      <td class="kana-cell">${w.kana}</td>
      <td>${w.meaning}</td>
      <td style="font-size:12px;color:var(--sub);">${w.note||''}</td>
      <td style="text-align:center;font-size:12px;color:var(--sub);">${w.quizCount}</td>
      <td style="text-align:center;font-size:12px;color:var(--wrong);">${w.wrongCount}</td>
      <td>${tags}</td>
    </tr>`;
  }).join('');
  document.getElementById('dict-body').innerHTML=`
    <table class="dict-table">
      <thead><tr><th>한자</th><th>히라가나</th><th>뜻</th><th>부가설명</th><th>퀴즈횟수</th><th>틀린횟수</th><th>상태</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function exportTxt(){
  const key=document.getElementById('sort-key').value;
  const dir=document.getElementById('sort-dir').value;
  let list=[...WORDS];
  if(dictSeg==='wrong')  list=list.filter(w=>WRONG_SET.has(w.id));
  if(dictSeg==='master') list=list.filter(w=>isAnyMastered(w.id));
  list.sort((a,b)=>{
    let va=a[key],vb=b[key];
    if(typeof va==='string')va=va.localeCompare(vb,'ja'); else va=va-vb;
    return dir==='asc'?va:-va;
  });
  const lines=list.map(w=>{
    const base=w.kanji?`${w.kanji}:${w.kana}:${w.meaning}`:`\t${w.kana}:${w.meaning}`;
    return w.note ? base+`:${w.note}` : base;
  });
  const blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`단어장_${dictSeg}_${new Date().toLocaleDateString('ko-KR').replace(/\. /g,'-').replace('.','')}.txt`;
  a.click();
}

const MODES=[
  {id:'mc-mean',  label:'객관식 — 뜻 고르기',       desc:'일본어 보고 한국어 뜻 선택'},
  {id:'sa-mean',  label:'주관식 — 뜻 입력',         desc:'일본어 보고 한국어 뜻 입력'},
  {id:'mc-kana',  label:'객관식 — 가나 고르기',     desc:'한국어 뜻 보고 가나 선택'},
  {id:'sa-kana',  label:'주관식 — 가나 입력',       desc:'한국어 뜻 보고 가나 입력'},
  {id:'sa-kanji', label:'주관식(한자) — 뜻 입력',  desc:'한자 단어만, 한자 보고 뜻 입력'},
  {id:'sa-note',  label:'주관식 — 설명 입력',       desc:'단어 보고 부가설명 입력 (설명 있는 단어만)'},
  {id:'sa-roma',  label:'로마자 입력',               desc:'일본어 보고 로마자로 입력'},
];
let quizPool='all';

function buildModeCards(){
  document.getElementById('mode-cards').innerHTML=MODES.map((m,i)=>`
    <label class="mode-card${i===1?' selected':''}" onclick="selectMode(this)">
      <input type="radio" name="qmode" value="${m.id}"${i===1?' checked':''}>
      <div class="mode-title">${m.label}</div>
      <div class="mode-desc">${m.desc}</div>
    </label>`).join('');
}
function selectMode(el){
  document.querySelectorAll('.mode-card').forEach(c=>c.classList.remove('selected'));
  el.classList.add('selected');
  el.querySelector('input').checked=true;
  document.getElementById('master-notice').style.display=quizPool==='all'?'block':'none';
  updateQuizPool(); // 설명 모드 시 풀 크기 갱신
}
function setQuizPool(p){
  quizPool=p;
  document.querySelectorAll('.pool-tab').forEach((b,i)=>b.classList.toggle('active',['all','wrong'][i]===p));
  document.getElementById('master-notice').style.display=p==='all'?'block':'none';
  updateQuizPool();
}
function updateQuizPool(){
  const list=getQuizList();
  document.getElementById('quiz-n-max').textContent=`최대 ${list.length}개`;
  document.getElementById('quiz-pool-info').textContent=
    quizPool==='all'
      ? `마스터 제외 ${list.length}개 출제 가능`
      : `오답노트 ${list.length}개`;
}
function getQuizList(){
  const mode = document.querySelector('input[name="qmode"]:checked')?.value||'';
  let list;
  if(quizPool==='wrong'){
    list = WORDS.filter(w=>WRONG_SET.has(w.id));
  } else {
    // 모드별 마스터 제외
    list = WORDS.filter(w=>!isMastered(w.id, mode));
  }
  // 모드별 추가 필터
  if(mode==='sa-note')  list = list.filter(w=>w.note&&w.note.trim());
  if(mode==='sa-kanji') list = list.filter(w=>!!w.kanji);
  return list;
}

// ══════════════════════════════════════════════
//  퀴즈 진행
// ══════════════════════════════════════════════
let QS={};   // quiz state
function shuffle(a){return a.sort(()=>Math.random()-.5);}

function startQuiz(){
  const pool=getQuizList();
  const n=Math.min(Math.max(1,parseInt(document.getElementById('quiz-n').value)||20),pool.length);
  if(!pool.length){alert('출제할 단어가 없어요.');return;}
  const mode=document.querySelector('input[name="qmode"]:checked').value;
  const isWrongPool=quizPool==='wrong';

  QS={
    pool, mode, isWrongPool,
    words: shuffle([...pool]).slice(0,n),
    idx:0, score:0, hintUsed:false,
    wrongs:[], newMasters:[], processing:false,
  };
  document.getElementById('quiz-setup').style.display='none';
  document.getElementById('quiz-result').style.display='none';
  document.getElementById('quiz-screen').style.display='block';
  nextQ();
}

function nextQ(){
  if(QS.idx>=QS.words.length){endQuiz();return;}
  QS.processing=false; QS.hintUsed=false;

  const w=QS.words[QS.idx];
  const pct=(QS.idx/QS.words.length*100).toFixed(1);
  document.getElementById('q-fill').style.width=pct+'%';
  document.getElementById('q-prog-text').textContent=`${QS.idx}/${QS.words.length}  점수:${QS.score}`;

  // 스트릭 바 (모드별)
  const mode=QS.mode;
  const k=mkey(w.id,mode);
  const cur=QS.isWrongPool?0:(STREAKS[k]||0);
  if(!QS.isWrongPool){
    const dots=Array.from({length:MASTER_THRESHOLD},(_,i)=>`<span class="s-dot${i<cur?' on':''}"></span>`).join('');
    document.getElementById('q-streak').innerHTML=
      isMastered(w.id,mode)
        ? '<span style="background:#FFF3CD;color:#856404;border:1px solid var(--gold);border-radius:99px;padding:2px 8px;font-size:11px;">⭐ 이 모드 마스터</span>'
        : `<span>연속 정답</span>${dots}<span>${cur}/${MASTER_THRESHOLD}</span>`;
  } else { document.getElementById('q-streak').innerHTML=''; }

  // 한자가 있는 단어: 50% 확률로 한자 or 가나 표시 (랜덤)
  const hasKanji = !!w.kanji;
  const showAsKanji = hasKanji && (Math.random() < 0.5);

  let displayQ, correctAns;
  if(mode==='mc-kana'||mode==='sa-kana'){
    // 뜻 보고 가나 맞추기
    displayQ   = w.meaning;
    correctAns = w.kana;
  } else if(mode==='sa-kanji'){
    // 한자 단어만, 반드시 한자로 표시
    displayQ   = w.kanji;
    correctAns = w.meaning;
  } else if(mode==='sa-note'){
    // 단어 보고 설명 입력
    displayQ   = showAsKanji ? w.kanji : w.kana;
    correctAns = w.note;
  } else {
    // 일본어(한자 or 가나 랜덤) 보고 뜻 or 로마자
    displayQ   = showAsKanji ? w.kanji : w.kana;
    correctAns = (mode==='sa-roma') ? w.kana : w.meaning;
  }
  QS.cur={w, displayQ, correctAns, showAsKanji};

  document.getElementById('q-word').textContent=displayQ;
  document.getElementById('q-feedback').textContent='';
  document.getElementById('q-feedback').className='';

  // 힌트: 한자로 표시된 경우에만 가나 힌트 제공 (설명 모드 포함)
  const needHint = (mode==='sa-kanji') || (showAsKanji && (mode==='mc-mean'||mode==='sa-mean'||mode==='sa-roma'||mode==='sa-note'));
  const hintBtn=document.getElementById('btn-hint');
  const hintKana=document.getElementById('q-hint-kana');
  hintBtn.style.display=needHint?'inline-block':'none';
  hintKana.style.display='none'; hintKana.textContent='';

  // 모드 힌트 문구 (한자/가나 표시 여부 반영)
  const modeHints={
    'mc-mean':  showAsKanji?'한자를 보고 뜻을 고르세요':'가나를 보고 뜻을 고르세요',
    'sa-mean':  showAsKanji?'한자를 보고 뜻을 입력하세요':'가나를 보고 뜻을 입력하세요',
    'mc-kana':  '한국어를 보고 가나를 고르세요',
    'sa-kana':  '한국어를 보고 가나를 입력하세요',
    'sa-kanji': '한자를 보고 한국어 뜻을 입력하세요 (힌트: 가나 확인)',
    'sa-note':  showAsKanji?'한자를 보고 부가설명을 입력하세요':'가나를 보고 부가설명을 입력하세요',
    'sa-roma':  showAsKanji?'한자를 보고 로마자로 입력하세요':'가나를 보고 로마자로 입력하세요',
  };
  document.getElementById('q-mode-hint').textContent=modeHints[mode]||'';

  const ch=document.getElementById('q-choices');
  const ai=document.getElementById('ans-input');
  const sb=document.getElementById('submit-btn');
  ch.innerHTML=''; ai.style.display='none'; ai.value=''; ai.className='';
  ai.disabled=false; ai.onkeydown=null; sb.style.display='none'; sb.disabled=false;

  if(mode==='mc-mean'||mode==='mc-kana'){
    // 객관식 — 오답 보기 생성
    const allAns=(mode==='mc-kana'?WORDS.map(x=>x.kana):WORDS.map(x=>x.meaning));
    const wrongs=shuffle(allAns.filter(v=>v!==correctAns)).slice(0,3);
    const opts=shuffle([...wrongs,correctAns]);
    ch.innerHTML=opts.map(o=>`<button class="c-btn" onclick="pickC(this,'${o.replace(/'/g,"&#39;")}')">${o}</button>`).join('');
  } else {
    ai.style.display='block'; sb.style.display='block';
    ai.placeholder=mode==='sa-roma'?'로마자 입력…'
                  :mode==='sa-kana'?'ひらがな入力…'
                  :mode==='sa-note'?'부가설명 입력…'
                  :mode==='sa-kanji'?'한국어 뜻 입력…'
                  :'뜻 입력…';
    ai.onkeydown=e=>{if(e.key==='Enter')submitAns();};
    setTimeout(()=>ai.focus(),50);
  }
}

function showHint(){
  const w=QS.cur.w;
  document.getElementById('btn-hint').style.display='none';
  document.getElementById('q-hint-kana').style.display='block';
  document.getElementById('q-hint-kana').textContent=w.kana;
  QS.hintUsed=true;
}

function pickC(btn,chosen){
  if(QS.processing)return;
  QS.processing=true;
  document.querySelectorAll('.c-btn').forEach(b=>b.disabled=true);
  const ok=checkAns(chosen,QS.cur.correctAns);
  btn.classList.add(ok?'ok':'ng');
  if(!ok) document.querySelectorAll('.c-btn').forEach(b=>{if(checkAns(b.textContent,QS.cur.correctAns))b.classList.add('ok');});
  processResult(ok);
  QS.idx++;
  setTimeout(nextQ,1000);
}

function submitAns(){
  if(QS.processing)return;
  const ai=document.getElementById('ans-input');
  const v=ai.value.trim(); if(!v)return;
  QS.processing=true; ai.disabled=true; document.getElementById('submit-btn').disabled=true;
  const mode=QS.mode;
  const ok=mode==='sa-roma'?romajiMatch(v,QS.cur.w.kana):checkAns(v,QS.cur.correctAns);
  ai.classList.add(ok?'ok':'ng');
  const fb=document.getElementById('q-feedback');
  // 오답 시 보조 정보: 뜻 모드면 가나도, 로마자 모드면 예시도 추가
  const kanaInfo = `  (${QS.cur.w.kana})`;
  if(ok){
    const okSub = (mode==='sa-roma'||mode==='sa-kana'||mode==='sa-note') ? '' : kanaInfo;
    fb.textContent=`⭕  정답!${okSub}`; fb.className='ok';
  } else {
    let hint='';
    if(mode==='sa-roma')  hint=`  (로마자 예: ${toRomaji(kataToHira(QS.cur.w.kana))})`;
    else if(mode==='sa-note')  hint=`  (단어: ${QS.cur.w.kanji||QS.cur.w.kana} / 뜻: ${QS.cur.w.meaning})`;
    else if(mode==='sa-kanji') hint=kanaInfo;
    else if(mode!=='sa-kana')  hint=kanaInfo;
    fb.textContent=`❌  오답!  정답: ${QS.cur.correctAns}${hint}`; fb.className='ng';
  }
  processResult(ok);
  QS.idx++;
  setTimeout(nextQ,1200);
}

function processResult(ok){
  const w=QS.cur.w;
  const mode=QS.mode;
  const k=mkey(w.id,mode);
  const wobj=WORDS.find(x=>x.id===w.id);
  if(wobj) wobj.quizCount++;

  if(ok && !QS.hintUsed){
    QS.score++;
    if(!QS.isWrongPool){
      // 모드별 스트릭
      STREAKS[k]=(STREAKS[k]||0)+1;
      saveStreaks();
      if(STREAKS[k]>=MASTER_THRESHOLD && !isMastered(w.id,mode)){
        setMastered(w.id,mode);
        delete STREAKS[k];
        saveStreaks();
        QS.newMasters.push({w,mode});
        showMasterToast((w.kanji||w.kana)+' ('+modeLabel(mode)+')');
      }
    }
  } else if(!ok || QS.hintUsed){
    if(!ok && wobj) wobj.wrongCount++;
    WRONG_SET.add(w.id);
    if(!QS.isWrongPool){ STREAKS[k]=0; saveStreaks(); }
    WRONG_LOG.push({id:w.id,word:w.kanji||w.kana,ans:QS.cur.correctAns,date:new Date().toLocaleString('ko-KR')});
    QS.wrongs.push(w);
    saveWrong();
  }
  saveWords(WORDS);
}

function modeLabel(mode){
  const map={'mc-mean':'객관식뜻','sa-mean':'주관식뜻','mc-kana':'객관식가나',
             'sa-kana':'주관식가나','sa-kanji':'한자뜻','sa-note':'설명','sa-roma':'로마자'};
  return map[mode]||mode;
}

function showMasterToast(word){
  const t=document.getElementById('master-toast');
  t.textContent=`⭐ "${word}" 마스터!`;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

function endQuiz(){
  document.getElementById('quiz-screen').style.display='none';
  document.getElementById('quiz-result').style.display='block';
  const pct=Math.round(QS.score/QS.words.length*100);
  document.getElementById('r-score').textContent=`${QS.score} / ${QS.words.length}`;
  document.getElementById('r-sub').textContent=`정답률 ${pct}%  ·  오답 ${QS.wrongs.length}개`;

  const rm=document.getElementById('r-master');
  if(QS.newMasters.length){
    rm.innerHTML=`<div style="font-size:12px;background:#FFF3CD;border:1px solid var(--gold);border-radius:8px;padding:8px 12px;margin-bottom:10px;">⭐ 이번 세션 마스터: ${QS.newMasters.map(({w,mode})=>(w.kanji||w.kana)+'('+modeLabel(mode)+')').join(', ')}</div>`;
  } else { rm.innerHTML=''; }

  const rw=document.getElementById('r-wrongs');
  if(QS.wrongs.length){
    rw.innerHTML=`<div style="font-size:12px;color:var(--accent);margin-bottom:5px;">오답 목록</div>
      <div class="wrong-list">${QS.wrongs.map(w=>`<div class="wr-row"><span class="wr-q">${w.kanji||w.kana}</span><span>→ ${w.meaning}</span></div>`).join('')}</div>`;
  } else {
    rw.innerHTML='<div style="text-align:center;color:var(--green);font-size:18px;padding:16px;">🎉 오답 없음!</div>';
  }
  updateHeader();
}

function backToSetup(){
  document.getElementById('quiz-result').style.display='none';
  document.getElementById('quiz-screen').style.display='none';
  document.getElementById('quiz-setup').style.display='block';
  updateQuizPool(); updateHeader();
}

// ══════════════════════════════════════════════
//  단어 편집
// ══════════════════════════════════════════════
function renderEdit(){
  const rows=WORDS.map(w=>`
    <tr data-id="${w.id}">
      <td><input class="e-inp" data-f="kanji" value="${esc(w.kanji)}"></td>
      <td><input class="e-inp" data-f="kana"  value="${esc(w.kana)}"></td>
      <td><input class="e-inp" data-f="meaning" value="${esc(w.meaning)}"></td>
      <td><input class="e-inp" data-f="note" value="${esc(w.note||'')}" placeholder="부가설명"></td>
      <td><button class="btn-del" onclick="delWord(${w.id})">삭제</button></td>
    </tr>`).join('');
  document.getElementById('edit-body').innerHTML=`
    <table class="edit-table">
      <thead><tr><th>한자</th><th>히라가나 *</th><th>한국어 뜻 *</th><th>부가설명</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}

function addWord(){
  const kanji=(document.getElementById('add-kanji').value||'').trim();
  const kana =(document.getElementById('add-kana').value||'').trim();
  const mean =(document.getElementById('add-mean').value||'').trim();
  const note =(document.getElementById('add-note').value||'').trim();
  if(!kana||!mean){alert('히라가나와 뜻은 필수예요.');return;}
  const newId=Math.max(0,...WORDS.map(w=>w.id))+1;
  WORDS.push({id:newId,kanji,kana,meaning:mean,note,addedAt:newId,quizCount:0,wrongCount:0,streak:0});
  saveWords(WORDS);
  document.getElementById('add-kanji').value='';
  document.getElementById('add-kana').value='';
  document.getElementById('add-mean').value='';
  document.getElementById('add-note').value='';
  renderEdit(); updateHeader();
}

function delWord(id){
  if(!confirm('이 단어를 삭제할까요?'))return;
  WORDS=WORDS.filter(w=>w.id!==id);
  // 마스터 맵에서 해당 단어 모든 모드 제거
  Object.keys(MASTER_MAP).filter(k=>k.startsWith(id+'_')).forEach(k=>delete MASTER_MAP[k]);
  WRONG_SET.delete(id);
  saveMaster(); saveWrong(); saveWords(WORDS);
  renderEdit(); updateHeader();
}

function saveEdits(){
  const rows=document.querySelectorAll('#edit-body tbody tr');
  const newWords=[];
  rows.forEach(row=>{
    const id=parseInt(row.dataset.id);
    const kanji=(row.querySelector('[data-f="kanji"]').value||'').trim();
    const kana =(row.querySelector('[data-f="kana"]').value||'').trim();
    const mean =(row.querySelector('[data-f="meaning"]').value||'').trim();
    const note =(row.querySelector('[data-f="note"]').value||'').trim();
    if(!kana||!mean)return;
    const orig=WORDS.find(w=>w.id===id)||{quizCount:0,wrongCount:0,streak:0,addedAt:id};
    newWords.push({...orig,id,kanji,kana,meaning:mean,note});
  });
  WORDS=newWords;
  saveWords(WORDS);
  updateHeader(); renderDict();
  alert('저장됐어요!');
}

// ══════════════════════════════════════════════
//  초기화
// ══════════════════════════════════════════════
function init(){
  WORDS     =loadWords();
  MASTER_MAP=JSON.parse(localStorage.getItem(SK_MASTER)||'{}');
  WRONG_SET =new Set(JSON.parse(localStorage.getItem(SK_WRONG)||'[]'));
  WRONG_LOG =JSON.parse(localStorage.getItem(SK_WRONG_LOG)||'[]');
  STREAKS   =JSON.parse(localStorage.getItem(SK_STREAKS)||'{}');
  buildModeCards();
  updateHeader();
  renderDict();
  updateQuizPool();
}
init();
</script>
