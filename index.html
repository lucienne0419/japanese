<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>日本語 単語帳</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+KR:wght@400;600;700&display=swap');
:root{--bg:#F4F3EF;--card:#fff;--ink:#1A1A2E;--sub:#6B7280;--accent:#D94F3D;--blue:#3A7BDE;--green:#27AE60;--wrong:#E74C3C;--border:#E5E7EB;--radius:12px;--gold:#F5A623;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);font-family:"Noto Sans KR","Noto Sans JP",sans-serif;color:var(--ink);min-height:100vh;}
#hdr{position:sticky;top:0;z-index:100;background:var(--ink);color:#fff;padding:10px 18px;}
#hdr-top{display:flex;align-items:center;gap:12px;margin-bottom:6px;}
.logo{font-size:18px;font-weight:700;}.logo span{color:var(--accent);}
#hdr-stats{display:flex;gap:8px;flex-wrap:wrap;}
.chip{background:rgba(255,255,255,.13);border-radius:99px;padding:3px 11px;font-size:12px;}
#recent-w{font-size:11px;color:rgba(255,255,255,.5);margin-top:3px;min-height:15px;}
#drive-bar{display:flex;gap:7px;align-items:center;margin-top:7px;flex-wrap:wrap;}
.dbtn{border:none;border-radius:7px;cursor:pointer;font-family:inherit;font-size:12px;font-weight:600;padding:5px 12px;background:rgba(255,255,255,.15);color:#fff;}
.dbtn:hover{background:rgba(255,255,255,.25);}
.dbtn-save{background:rgba(66,133,244,.7);}
.dbtn-load{background:rgba(52,168,83,.7);}
#drive-st{font-size:11px;color:rgba(255,255,255,.55);}
#main{max-width:780px;margin:0 auto;padding:16px;}
#tab-nav{display:flex;gap:6px;margin-bottom:14px;}
.tab-btn{padding:8px 16px;border:1.5px solid var(--border);border-radius:99px;background:#fff;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;color:var(--sub);}
.tab-btn.active{background:var(--ink);border-color:var(--ink);color:#fff;}
.card{background:var(--card);border-radius:var(--radius);padding:20px 18px;box-shadow:0 1px 8px rgba(0,0,0,.06);margin-bottom:12px;}
.btn{border:none;border-radius:8px;cursor:pointer;font-family:inherit;font-weight:600;}
.btn:hover{opacity:.86;}
.btn-primary{background:var(--accent);color:#fff;padding:11px 20px;font-size:14px;}
.btn-blue{background:var(--blue);color:#fff;padding:8px 16px;font-size:13px;}
.btn-ghost{background:var(--border);color:var(--sub);padding:8px 14px;font-size:13px;}
.btn-danger{background:#FEE2E2;color:var(--wrong);padding:6px 12px;font-size:12px;}
.btn-sm{padding:5px 11px;font-size:12px;}
.screen{display:none;}.screen.active{display:block;}
/* 단어장 */
#dict-toolbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:10px;}
#dict-search{flex:1;min-width:130px;padding:7px 13px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;}
#dict-search:focus{outline:none;border-color:var(--blue);}
.seg-ctrl{display:flex;border:1.5px solid var(--border);border-radius:8px;overflow:hidden;}
.seg-btn{padding:6px 12px;border:none;background:#fff;font-size:12px;font-family:inherit;cursor:pointer;color:var(--sub);}
.seg-btn.active{background:var(--ink);color:#fff;font-weight:700;}
.sort-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px;}
.sort-sel{padding:5px 9px;border:1.5px solid var(--border);border-radius:7px;font-size:12px;font-family:inherit;}
#theme-filter{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px;}
.tchip{padding:4px 11px;border:1.5px solid var(--border);border-radius:99px;font-size:12px;cursor:pointer;background:#fff;color:var(--sub);white-space:nowrap;}
.tchip:hover{border-color:var(--blue);color:var(--blue);}
.tchip.active{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700;}
.dict-scroll{max-height:480px;overflow-y:auto;border:1px solid var(--border);border-radius:10px;}
.dtbl{width:100%;border-collapse:collapse;font-size:13px;}
.dtbl th{background:#F8F9FA;padding:7px 9px;text-align:left;font-size:11px;color:var(--sub);font-weight:700;border-bottom:2px solid var(--border);white-space:nowrap;}
.dtbl td{padding:7px 9px;border-bottom:1px solid var(--border);vertical-align:middle;}
.dtbl tr:last-child td{border-bottom:none;}
.dtbl tr:hover td{background:#FAFBFC;}
.kana{font-family:"Noto Sans JP",sans-serif;}
.tag-m{font-size:10px;background:#FFF3CD;color:#856404;border:1px solid #FFD700;border-radius:99px;padding:1px 6px;font-weight:700;}
.tag-w{font-size:10px;background:#FEE2E2;color:var(--wrong);border:1px solid #FCA5A5;border-radius:99px;padding:1px 6px;font-weight:700;}
/* 퀴즈 */
.pool-tabs{display:flex;gap:6px;margin-bottom:10px;}
.ptab{padding:6px 13px;border:1.5px solid var(--border);border-radius:8px;background:#fff;font-size:13px;cursor:pointer;color:var(--sub);font-family:inherit;}
.ptab.active{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700;}
.quiz-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
@media(max-width:480px){.quiz-grid{grid-template-columns:1fr;}}
.mcard{border:2px solid var(--border);border-radius:10px;padding:11px 13px;cursor:pointer;}
.mcard:hover{border-color:var(--blue);}
.mcard.sel{border-color:var(--blue);background:#EEF4FF;}
.mcard input{display:none;}
.mt{font-size:13px;font-weight:700;margin-bottom:2px;}
.md{font-size:11px;color:var(--sub);}
#quiz-n-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin:12px 0;}
#quiz-n{width:65px;padding:6px 9px;border:1.5px solid var(--border);border-radius:7px;font-size:14px;font-family:inherit;text-align:center;}
#master-notice{font-size:12px;background:#FFFBEA;border:1px solid var(--gold);border-radius:8px;padding:7px 11px;margin-bottom:10px;display:none;}
/* 퀴즈 진행 */
#qscreen{display:none;}
.qprog-bg{height:5px;background:var(--border);border-radius:99px;overflow:hidden;margin-bottom:4px;}
.qprog-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .3s;}
#qprog-txt{font-size:11px;color:var(--sub);text-align:right;margin-bottom:12px;}
#streak-bar{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--sub);min-height:20px;margin-bottom:6px;flex-wrap:wrap;}
.sdot{width:10px;height:10px;border-radius:50%;background:var(--border);}
.sdot.on{background:var(--green);}
#qword{font-size:50px;font-weight:700;text-align:center;padding:22px 8px 6px;line-height:1.2;word-break:break-all;}
#hint-area{text-align:center;min-height:24px;margin-bottom:10px;}
.hint-kana{font-family:"Noto Sans JP",sans-serif;font-size:18px;color:var(--sub);display:none;}
.btn-hint{background:#FFF9E6;border:1.5px solid var(--gold);color:#92640A;border-radius:7px;padding:4px 13px;font-size:12px;font-weight:700;cursor:pointer;}
#qmode-hint{text-align:center;font-size:12px;color:var(--sub);margin-bottom:14px;}
.choices{display:flex;flex-direction:column;gap:7px;}
.cbtn{padding:12px 15px;border:1.5px solid var(--border);border-radius:10px;background:#FAFAFA;font-size:14px;font-family:inherit;text-align:left;cursor:pointer;}
.cbtn:hover:not(:disabled){border-color:var(--blue);background:#EEF4FF;}
.cbtn.ok{border-color:var(--green);background:#EAFAF1;color:#1E8449;}
.cbtn.ng{border-color:var(--wrong);background:#FDEDEC;color:#922B21;}
#ans-input{width:100%;padding:12px 15px;border:1.5px solid var(--border);border-radius:10px;font-size:16px;font-family:"Noto Sans JP","Noto Sans KR",sans-serif;text-align:center;margin-bottom:10px;}
#ans-input:focus{outline:none;border-color:var(--blue);}
#ans-input.ok{border-color:var(--green);background:#EAFAF1;}
#ans-input.ng{border-color:var(--wrong);background:#FDEDEC;}
#submit-btn{width:100%;padding:12px;background:var(--blue);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;}
#qfeedback{min-height:24px;margin-top:11px;text-align:center;font-size:14px;font-weight:600;}
#qfeedback.ok{color:var(--green);}
#qfeedback.ng{color:var(--wrong);}
#master-toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#212529;color:var(--gold);font-size:13px;font-weight:700;padding:8px 20px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:999;}
#master-toast.show{opacity:1;}
/* 결과 */
.rbig{text-align:center;font-size:56px;font-weight:700;color:var(--blue);padding:6px 0;}
.rsub{text-align:center;font-size:14px;color:var(--sub);margin-bottom:16px;}
.wlist{background:#FFF8F8;border:1px solid #FDD;border-radius:10px;padding:11px 13px;max-height:200px;overflow-y:auto;font-size:13px;}
.wrow{display:flex;gap:8px;padding:3px 0;border-bottom:1px solid #FFE4E4;}
.wrow:last-child{border-bottom:none;}
.wq{color:var(--wrong);font-weight:700;min-width:100px;}
.rbtns{display:flex;gap:7px;margin-top:14px;}
.rbtns .btn{flex:1;padding:10px 0;font-size:13px;}
/* 편집 */
.etbl{width:100%;border-collapse:collapse;font-size:13px;}
.etbl th{background:#F8F9FA;padding:7px 9px;font-size:11px;color:var(--sub);font-weight:700;text-align:left;border-bottom:2px solid var(--border);}
.etbl td{padding:4px 7px;border-bottom:1px solid var(--border);}
.einp{width:100%;padding:4px 7px;border:1.5px solid var(--border);border-radius:5px;font-size:12px;font-family:inherit;}
.einp:focus{outline:none;border-color:var(--blue);}
.btn-del{background:#FEE2E2;color:var(--wrong);border:none;border-radius:5px;padding:3px 9px;font-size:11px;cursor:pointer;}
.escroll{max-height:400px;overflow-y:auto;border:1px solid var(--border);border-radius:10px;margin-bottom:10px;}
.addrow{display:flex;gap:6px;margin-bottom:9px;flex-wrap:wrap;}
.addrow input{flex:1;min-width:80px;padding:7px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:12px;font-family:inherit;}
.addrow input:focus{outline:none;border-color:var(--blue);}
/* 테마 모달 */
#theme-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;align-items:center;justify-content:center;}
#theme-modal-inner{background:#fff;border-radius:14px;padding:22px;width:90%;max-width:460px;max-height:80vh;overflow-y:auto;}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-thumb{background:#ccc;border-radius:99px;}
/* ── 플래시카드 ── */
#fc-setup .pool-tabs{margin-bottom:10px;}
.fc-wrap{perspective:1000px;width:100%;max-width:500px;margin:0 auto 20px;cursor:pointer;user-select:none;}
.fc-inner{position:relative;width:100%;padding-top:56%;transition:transform .5s;transform-style:preserve-3d;}
.fc-inner.flipped{transform:rotateY(180deg);}
.fc-front,.fc-back{position:absolute;inset:0;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;backface-visibility:hidden;}
.fc-front{background:var(--card);border:2px solid var(--border);box-shadow:0 4px 20px rgba(0,0,0,.08);}
.fc-back{background:linear-gradient(135deg,#1A1A2E,#2E3A6E);color:#fff;transform:rotateY(180deg);}
.fc-kana{font-family:"Noto Sans JP",sans-serif;font-size:13px;color:var(--sub);margin-bottom:6px;}
.fc-word{font-size:44px;font-weight:700;text-align:center;line-height:1.2;word-break:break-all;}
.fc-sub{font-size:13px;color:rgba(255,255,255,.6);margin-top:8px;}
.fc-hint{font-size:12px;color:var(--sub);text-align:center;margin-bottom:8px;}
.fc-btns{display:flex;gap:12px;justify-content:center;}
.fc-btn-no{background:#FEE2E2;color:var(--wrong);border:none;border-radius:12px;padding:14px 32px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:transform .1s;}
.fc-btn-yes{background:#D1FAE5;color:#065F46;border:none;border-radius:12px;padding:14px 32px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:transform .1s;}
.fc-btn-no:hover,.fc-btn-yes:hover{transform:scale(1.05);}
.fc-btn-sound{background:none;border:1.5px solid var(--border);border-radius:8px;padding:6px 14px;font-size:13px;cursor:pointer;color:var(--sub);}
.fc-btn-sound:hover{border-color:var(--blue);color:var(--blue);}
.fc-prog{font-size:12px;color:var(--sub);text-align:center;margin-bottom:12px;}
.fc-result-card{text-align:center;padding:20px 0;}

</style>
</head>
<body>
<div id="hdr">
  <div id="hdr-top">
    <div class="logo">日<span>本語</span> 単語帳</div>
    <div id="hdr-stats">
      <div class="chip">📚 총 <b id="h-total">0</b>개</div>
      <div class="chip">⭐ 마스터 <b id="h-master">0</b>개</div>
      <div class="chip">❌ 오답 <b id="h-wrong">0</b>개</div>
    </div>
  </div>
  <div id="recent-w">최근 틀린 단어: 없음</div>
  <div id="drive-bar">
    <button id="btn-login" class="dbtn" onclick="gLogin()" style="display:none">🔑 구글 로그인</button>
    <button id="btn-save"  class="dbtn dbtn-save" onclick="gSave()" style="display:none">☁️ 저장</button>
    <button id="btn-load"  class="dbtn dbtn-load" onclick="gLoad()" style="display:none">📂 불러오기</button>
    <span id="drive-st"></span>
  </div>
</div>

<div id="main">
  <div id="tab-nav">
    <button class="tab-btn active" onclick="setTab('dict')">📖 단어장</button>
    <button class="tab-btn" onclick="setTab('flash')">🃏 플래시카드</button>
    <button class="tab-btn" onclick="setTab('quiz')">✏️ 퀴즈</button>
    <button class="tab-btn" onclick="setTab('edit')">⚙️ 단어 편집</button>
  </div>

  <!-- 단어장 -->
  <div id="tab-dict" class="screen active">
    <div class="card">
      <div id="dict-toolbar">
        <input id="dict-search" type="text" placeholder="검색…" oninput="renderDict()">
        <div class="seg-ctrl">
          <button class="seg-btn active" onclick="setDSeg('all')">전체</button>
          <button class="seg-btn" onclick="setDSeg('wrong')">오답</button>
          <button class="seg-btn" onclick="setDSeg('master')">마스터</button>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="exportTxt()">⬇ TXT</button>
      </div>
      <div id="theme-filter"></div>
      <div class="sort-row">
        <label style="font-size:12px;color:var(--sub)">정렬</label>
        <select class="sort-sel" id="sort-key" onchange="renderDict()">
          <option value="addedAt">입력 순</option>
          <option value="kana">히라가나 순</option>
          <option value="meaning">뜻 순</option>
          <option value="quizCount">퀴즈 횟수</option>
          <option value="wrongCount">틀린 횟수</option>
        </select>
        <select class="sort-sel" id="sort-dir" onchange="renderDict()">
          <option value="asc">오름차순</option>
          <option value="desc">내림차순</option>
        </select>
      </div>
      <div class="dict-scroll" id="dict-body"></div>
    </div>
  </div>

  <!-- 퀴즈 -->
  <div id="tab-quiz" class="screen">
    <div id="qsetup" class="card">
      <div class="pool-tabs">
        <button class="ptab active" onclick="setPool('all')">전체</button>
        <button class="ptab" onclick="setPool('wrong')">오답노트</button>
      </div>
      <!-- 퀴즈 테마 선택 -->
      <div style="margin-bottom:10px;">
        <div style="font-size:11px;color:var(--sub);margin-bottom:5px;font-weight:600;">테마 선택</div>
        <div id="quiz-theme-filter" style="display:flex;gap:5px;flex-wrap:wrap;"></div>
      </div>
      <div id="quiz-pool-info" style="font-size:12px;color:var(--sub);margin-bottom:10px;"></div>
      <div id="quiz-n-row">
        <label style="font-size:13px;color:var(--sub)">문제 수</label>
        <input id="quiz-n" type="number" value="20" min="1">
        <span id="quiz-n-max" style="font-size:12px;color:var(--sub)"></span>
      </div>
      <div style="font-size:11px;color:var(--sub);margin-bottom:8px;font-weight:600;">퀴즈 모드</div>
      <div class="quiz-grid" id="mode-cards"></div>
      <div id="master-notice">⭐ 전체 퀴즈 — 3회 연속 정답 시 모드별 마스터, 이후 출제 제외</div>
      <button class="btn btn-primary" style="width:100%" onclick="startQuiz()">퀴즈 시작 →</button>
    </div>
    <div id="qscreen">
      <div id="master-toast">⭐ 마스터!</div>
      <div class="card">
        <div class="qprog-bg"><div class="qprog-fill" id="qfill" style="width:0%"></div></div>
        <div id="qprog-txt">0/0</div>
        <div id="streak-bar"></div>
        <div id="qword">—</div>
        <div id="hint-area">
          <button class="btn-hint" id="btn-hint" onclick="showHint()" style="display:none">💡 가나 힌트</button>
          <div class="hint-kana" id="hint-kana"></div>
        </div>
        <div id="qmode-hint"></div>
        <div id="q-choices"></div>
        <input id="ans-input" type="text" autocomplete="off" autocorrect="off" spellcheck="false" style="display:none">
        <button id="submit-btn" onclick="submitAns()" style="display:none">제출하기</button>
        <div id="qfeedback"></div>
      </div>
    </div>
    <div id="qresult" style="display:none">
      <div class="card">
        <div style="text-align:center;font-size:11px;color:var(--sub);margin-bottom:3px">RESULT</div>
        <div class="rbig" id="r-score">—</div>
        <div class="rsub" id="r-sub"></div>
        <div id="r-master"></div>
        <div id="r-wrongs"></div>
        <div class="rbtns">
          <button class="btn btn-ghost" onclick="backSetup()">← 설정</button>
          <button class="btn btn-primary" onclick="startQuiz()">다시 풀기</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 플래시카드 -->
  <div id="tab-flash" class="screen">
    <div id="fc-setup" class="card">
      <div class="pool-tabs">
        <button class="ptab active" onclick="setFCPool('all')">전체</button>
        <button class="ptab" onclick="setFCPool('wrong')">오답노트</button>
      </div>
      <div id="fc-theme-filter" style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px;"></div>
      <div id="fc-pool-info" style="font-size:12px;color:var(--sub);margin-bottom:12px;"></div>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
        <label style="font-size:13px;color:var(--sub)">순서</label>
        <select id="fc-order" class="sort-sel">
          <option value="random">랜덤</option>
          <option value="order">입력 순</option>
          <option value="wrong">틀린 횟수 많은 순</option>
        </select>
      </div>
      <button class="btn btn-primary" style="width:100%" onclick="startFlash()">플래시카드 시작 →</button>
    </div>
    <div id="fc-screen" style="display:none">
      <div class="fc-prog" id="fc-prog"></div>
      <div class="fc-wrap" id="fc-wrap" onclick="flipCard()">
        <div class="fc-inner" id="fc-inner">
          <div class="fc-front">
            <div class="fc-kana" id="fc-front-kana"></div>
            <div class="fc-word" id="fc-front-word"></div>
            <div class="fc-hint" id="fc-tap-hint">👆 탭하면 뜻이 보여요</div>
          </div>
          <div class="fc-back">
            <div style="font-size:22px;font-weight:700;margin-bottom:6px;" id="fc-back-mean"></div>
            <div class="fc-sub" id="fc-back-kana"></div>
            <div class="fc-sub" id="fc-back-note"></div>
          </div>
        </div>
      </div>
      <div style="text-align:center;margin-bottom:14px;">
        <button class="fc-btn-sound" onclick="speakWord()">🔊 발음 듣기</button>
      </div>
      <div class="fc-btns" id="fc-btns" style="display:none">
        <button class="fc-btn-no" onclick="fcAnswer(false)">✕ 몰라요</button>
        <button class="fc-btn-yes" onclick="fcAnswer(true)">○ 알아요</button>
      </div>
    </div>
    <div id="fc-result" style="display:none" class="card">
      <div class="fc-result-card">
        <div style="font-size:48px;margin-bottom:8px">🎉</div>
        <div style="font-size:20px;font-weight:700;margin-bottom:4px">완료!</div>
        <div id="fc-result-sub" style="font-size:14px;color:var(--sub);margin-bottom:16px"></div>

const SK_WLOG    = 'jpq_wlog';
const SK_STREAKS = 'jpq_streaks2';
const MTHRESH    = 3;

// ── 데이터 로드 ──
function loadWords(){
  try{ const s=localStorage.getItem(SK_WORDS); if(s) return JSON.parse(s); }catch{}
  return JSON.parse(JSON.stringify(BASE_WORDS));
}
function saveWords(w){ localStorage.setItem(SK_WORDS,JSON.stringify(w)); }
function resetDefault(){
  if(!confirm('모든 단어를 기본값으로 초기화할까요?\n(마스터·오답 기록도 삭제됩니다)')) return;
  [SK_WORDS,SK_MASTER,SK_WRONG,SK_WLOG,SK_STREAKS].forEach(k=>localStorage.removeItem(k));
  init();
}

let WORDS    = loadWords();
let MMAP     = JSON.parse(localStorage.getItem(SK_MASTER)||'{}');
let WSET     = new Set(JSON.parse(localStorage.getItem(SK_WRONG)||'[]'));
let WLOG     = JSON.parse(localStorage.getItem(SK_WLOG)||'[]');
let STREAKS  = JSON.parse(localStorage.getItem(SK_STREAKS)||'{}');

function mkey(id,mode){ return id+'_'+mode; }
function isMastered(id,mode){ return !!MMAP[mkey(id,mode)]; }
function setMastered(id,mode){ MMAP[mkey(id,mode)]=true; saveMaster(); }
function isAnyMastered(id){ return Object.keys(MMAP).some(k=>k.startsWith(id+'_')); }
function totalMastered(){ return new Set(Object.keys(MMAP).map(k=>k.split('_')[0])).size; }
function saveMaster(){ localStorage.setItem(SK_MASTER,JSON.stringify(MMAP)); }
function saveWrong(){ localStorage.setItem(SK_WRONG,JSON.stringify([...WSET])); localStorage.setItem(SK_WLOG,JSON.stringify(WLOG)); }

const ROM={'あ':'a','い':'i','う':'u','え':'e','お':'o','か':'ka','き':'ki','く':'ku','け':'ke','こ':'ko','さ':'sa','し':'shi','す':'su','せ':'se','そ':'so','た':'ta','ち':'chi','つ':'tsu','て':'te','と':'to','な':'na','に':'ni','ぬ':'nu','ね':'ne','の':'no','は':'ha','ひ':'hi','ふ':'fu','へ':'he','ほ':'ho','ま':'ma','み':'mi','む':'mu','め':'me','も':'mo','や':'ya','ゆ':'yu','よ':'yo','ら':'ra','り':'ri','る':'ru','れ':'re','ろ':'ro','わ':'wa','を':'wo','ん':'n','が':'ga','ぎ':'gi','ぐ':'gu','げ':'ge','ご':'go','ざ':'za','じ':'ji','ず':'zu','ぜ':'ze','ぞ':'zo','だ':'da','で':'de','ど':'do','ば':'ba','び':'bi','ぶ':'bu','べ':'be','ぼ':'bo','ぱ':'pa','ぴ':'pi','ぷ':'pu','ぺ':'pe','ぽ':'po','きゃ':'kya','きゅ':'kyu','きょ':'kyo','しゃ':'sha','しゅ':'shu','しょ':'sho','ちゃ':'cha','ちゅ':'chu','ちょ':'cho','にゃ':'nya','にゅ':'nyu','にょ':'nyo','ひゃ':'hya','みゃ':'mya','みゅ':'myu','みょ':'myo','りゃ':'rya','りゅ':'ryu','りょ':'ryo','ぎゃ':'gya','ぎゅ':'gyu','ぎょ':'gyo','じゃ':'ja','じゅ':'ju','じょ':'jo','びゃ':'bya','びゅ':'byu','びょ':'byo','ぴゃ':'pya','ぴゅ':'pyu','ぴょ':'pyo'};
function k2h(s){ return s.split('').map(c=>{const n=c.charCodeAt(0);return(n>=0x30A1&&n<=0x30F6)?String.fromCharCode(n-0x60):c}).join(''); }
function toRom(kana){ const h=k2h(kana);let r='',i=0; while(i<h.length){ if(i+1<h.length&&ROM[h[i]+h[i+1]]){r+=ROM[h[i]+h[i+1]];i+=2;} else if(h[i]==='っ'&&i+1<h.length){r+=(ROM[h[i+1]]||'')[0]||'';i++;} else if(h[i]==='ー'){i++;} else{r+=ROM[h[i]]||h[i];i++;} } return r; }
function romMatch(inp,kana){ const u=inp.toLowerCase().replace(/\s/g,''); return kana.split('／').some(t=>{ const r=toRom(k2h(t.split('/')[0])); return u===r||u===r.replace(/sh/g,'s').replace(/ch/g,'t'); }); }
function chkAns(inp,correct){
  const u=inp.replace(/\s/g,'').toLowerCase(); if(!u) return false;
  return correct.split(/[\/／]/).some(p=>{ const a=p.replace(/\s/g,'').toLowerCase(); if(u===a) return true; const b=a.replace(/\(.*?\)/g,'').replace(/（.*?）/g,'').trim(); return b!==''&&u===b; });
}

function setDSeg(s){ dSeg=s; document.querySelectorAll('.seg-btn').forEach((b,i)=>b.classList.toggle('active',['all','wrong','master'][i]===s)); renderDict(); }
function renderDict(){
  const q=(document.getElementById('dict-search').value||'').toLowerCase();
  const key=document.getElementById('sort-key').value;
  const dir=document.getElementById('sort-dir').value;
  let list=[...WORDS];
  if(dSeg==='wrong') list=list.filter(w=>WSET.has(w.id));
  if(dSeg==='master') list=list.filter(w=>isAnyMastered(w.id));
  if(dTheme) list=list.filter(w=>(w.theme||'기타')===dTheme);
  if(q) list=list.filter(w=>(w.kanji+w.kana+w.meaning+(w.theme||'')).toLowerCase().includes(q));
  list.sort((a,b)=>{ let va=a[key],vb=b[key]; const d=typeof va==='string'?va.localeCompare(vb,'ja'):va-vb; return dir==='asc'?d:-d; });
  if(!list.length){ document.getElementById('dict-body').innerHTML='<div style="padding:20px;text-align:center;color:var(--sub)">단어 없음</div>'; return; }
  const rows=list.map(w=>`<tr><td style="font-size:14px;font-weight:700">${w.kanji||'—'}</td><td class="kana">${w.kana}</td><td>${w.meaning}</td><td><span style="background:#F3F4F6;border-radius:5px;padding:1px 6px;font-size:11px">${w.theme||'기타'}</span></td><td style="font-size:11px;color:var(--sub)">${w.note||''}</td><td style="text-align:center;font-size:12px">${w.quizCount}</td><td style="text-align:center;font-size:12px;color:var(--wrong)">${w.wrongCount}</td><td>${isAnyMastered(w.id)?'<span class="tag-m">⭐</span>':''}${WSET.has(w.id)?'<span class="tag-w">오답</span>':''}</td></tr>`).join('');
  document.getElementById('dict-body').innerHTML=`<table class="dtbl"><thead><tr><th>한자</th><th>히라가나</th><th>뜻</th><th>테마</th><th>부가설명</th><th>퀴즈</th><th>오답</th><th>상태</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function exportTxt(){
  const key=document.getElementById('sort-key').value, dir=document.getElementById('sort-dir').value;
  let list=[...WORDS];
  if(dSeg==='wrong') list=list.filter(w=>WSET.has(w.id));
  if(dSeg==='master') list=list.filter(w=>isAnyMastered(w.id));
  list.sort((a,b)=>{ let va=a[key],vb=b[key]; const d=typeof va==='string'?va.localeCompare(vb,'ja'):va-vb; return dir==='asc'?d:-d; });
  const lines=list.map(w=>w.kanji?`${w.kanji}:${w.kana}:${w.meaning}`:`\t${w.kana}:${w.meaning}`);

  a.download=`단어장_${dSeg}_${new Date().toLocaleDateString('ko-KR').replace(/\. /g,'-').replace('.','')}.txt`; a.click();
}

  {id:'mc-mean', label:'객관식 — 뜻 고르기',      desc:'일본어 보고 뜻 선택'},

function getQList(){

// ── 퀴즈 진행 ──
let QS={};
function shuffle(a){ return a.sort(()=>Math.random()-.5); }
function modeLabel(m){ return {'mc-mean':'객관식뜻','sa-mean':'주관식뜻','mc-kana':'객관식가나','sa-kana':'주관식가나','sa-kanji':'한자뜻','sa-note':'설명','sa-roma':'로마자'}[m]||m; }

function startQuiz(){
  const pool=getQList();
  const n=Math.min(Math.max(1,parseInt(document.getElementById('quiz-n').value)||20),pool.length);
  if(!pool.length){ alert('출제할 단어가 없어요.'); return; }
  const mode=document.querySelector('input[name="qmode"]:checked').value;
  QS={pool,mode,isWrong:qPool==='wrong',words:shuffle([...pool]).slice(0,n),idx:0,score:0,hint:false,wrongs:[],newM:[],proc:false};
  document.getElementById('qsetup').style.display='none';
  document.getElementById('qresult').style.display='none';
  document.getElementById('qscreen').style.display='block';
  nextQ();
}

function nextQ(){
  if(QS.idx>=QS.words.length){ endQuiz(); return; }
  QS.proc=false; QS.hint=false;
  const w=QS.words[QS.idx], mode=QS.mode;
  const pct=(QS.idx/QS.words.length*100).toFixed(1);
  document.getElementById('qfill').style.width=pct+'%';
  document.getElementById('qprog-txt').textContent=`${QS.idx}/${QS.words.length}  점수:${QS.score}`;

  // 스트릭 바
  const k=mkey(w.id,mode), cur=QS.isWrong?0:(STREAKS[k]||0);
  if(!QS.isWrong){
    const dots=Array.from({length:MTHRESH},(_,i)=>`<span class="sdot${i<cur?' on':''}"></span>`).join('');
    document.getElementById('streak-bar').innerHTML=isMastered(w.id,mode)?'<span style="background:#FFF3CD;color:#856404;border:1px solid var(--gold);border-radius:99px;padding:2px 8px;font-size:11px">⭐ 이 모드 마스터</span>':`<span>연속 정답</span>${dots}<span>${cur}/${MTHRESH}</span>`;
  } else document.getElementById('streak-bar').innerHTML='';

  const hasK=!!w.kanji, asK=hasK&&Math.random()<.5;
  let dQ,cA;
  if(mode==='mc-kana'||mode==='sa-kana'){ dQ=w.meaning; cA=w.kana; }
  else if(mode==='sa-kanji'){ dQ=w.kanji; cA=w.meaning; }
  else if(mode==='sa-note'){ dQ=asK?w.kanji:w.kana; cA=w.note; }
  else{ dQ=asK?w.kanji:w.kana; cA=mode==='sa-roma'?w.kana:w.meaning; }
  QS.cur={w,dQ,cA,asK};

  document.getElementById('qword').textContent=dQ;
  document.getElementById('qfeedback').textContent=''; document.getElementById('qfeedback').className='';

  const needHint=(mode==='sa-kanji')||(asK&&['mc-mean','sa-mean','sa-roma','sa-note'].includes(mode));
  document.getElementById('btn-hint').style.display=needHint?'inline-block':'none';
  document.getElementById('hint-kana').style.display='none'; document.getElementById('hint-kana').textContent='';

  const hintMap={'mc-mean':asK?'한자를 보고 뜻을 고르세요':'가나를 보고 뜻을 고르세요','sa-mean':asK?'한자를 보고 뜻을 입력하세요':'가나를 보고 뜻을 입력하세요','mc-kana':'한국어를 보고 가나를 고르세요','sa-kana':'한국어를 보고 가나를 입력하세요','sa-kanji':'한자를 보고 뜻을 입력하세요','sa-note':asK?'한자를 보고 설명을 입력하세요':'가나를 보고 설명을 입력하세요','sa-roma':asK?'한자를 보고 로마자로 입력하세요':'가나를 보고 로마자로 입력하세요'};
  document.getElementById('qmode-hint').textContent=hintMap[mode]||'';

  const ch=document.getElementById('q-choices'), ai=document.getElementById('ans-input'), sb=document.getElementById('submit-btn');
  ch.innerHTML=''; ai.style.display='none'; ai.value=''; ai.className=''; ai.disabled=false; ai.onkeydown=null; sb.style.display='none'; sb.disabled=false;

  if(mode==='mc-mean'||mode==='mc-kana'){
    const all=mode==='mc-kana'?WORDS.map(x=>x.kana):WORDS.map(x=>x.meaning);
    const opts=shuffle([...shuffle(all.filter(v=>v!==cA)).slice(0,3),cA]);
    ch.innerHTML=opts.map(o=>`<button class="cbtn" onclick="pickC(this,\`${o.replace(/`/g,'\\`')}\`)">${o}</button>`).join('');
  } else {
    ai.style.display='block'; sb.style.display='block';
    ai.placeholder=mode==='sa-roma'?'로마자…':mode==='sa-kana'?'ひらがな…':mode==='sa-note'?'부가설명…':'뜻 입력…';
    ai.onkeydown=e=>{ if(e.key==='Enter') submitAns(); };
    setTimeout(()=>ai.focus(),50);
  }
}

function showHint(){ document.getElementById('btn-hint').style.display='none'; document.getElementById('hint-kana').style.display='block'; document.getElementById('hint-kana').textContent=QS.cur.w.kana; QS.hint=true; }

function pickC(btn,chosen){
  if(QS.proc) return; QS.proc=true;
  document.querySelectorAll('.cbtn').forEach(b=>b.disabled=true);
  const ok=chkAns(chosen,QS.cur.cA);
  btn.classList.add(ok?'ok':'ng');
  if(!ok) document.querySelectorAll('.cbtn').forEach(b=>{ if(chkAns(b.textContent,QS.cur.cA)) b.classList.add('ok'); });
  procResult(ok); QS.idx++; setTimeout(nextQ,1000);
}

function submitAns(){
  if(QS.proc) return;
  const ai=document.getElementById('ans-input'), v=ai.value.trim(); if(!v) return;
  QS.proc=true; ai.disabled=true; document.getElementById('submit-btn').disabled=true;
  const mode=QS.mode, ok=mode==='sa-roma'?romMatch(v,QS.cur.w.kana):chkAns(v,QS.cur.cA);
  ai.classList.add(ok?'ok':'ng');
  const fb=document.getElementById('qfeedback');
  const kInfo=`  (${QS.cur.w.kana})`;
  if(ok){ fb.textContent='⭕  정답!'+(mode==='sa-roma'||mode==='sa-kana'||mode==='sa-note'?'':kInfo); fb.className='ok'; }
  else{
    let h='';
    if(mode==='sa-roma') h=`  (로마자 예: ${toRom(k2h(QS.cur.w.kana))})`;
    else if(mode==='sa-note') h=`  (단어: ${QS.cur.w.kanji||QS.cur.w.kana} / 뜻: ${QS.cur.w.meaning})`;
    else if(mode==='sa-kanji') h=kInfo;
    else if(mode!=='sa-kana') h=kInfo;
    fb.textContent=`❌  오답!  정답: ${QS.cur.cA}${h}`; fb.className='ng';
  }
  procResult(ok); QS.idx++; setTimeout(nextQ,1200);
}

function procResult(ok){
  const w=QS.cur.w, mode=QS.mode, k=mkey(w.id,mode);
  const wo=WORDS.find(x=>x.id===w.id); if(wo) wo.quizCount++;
  if(ok&&!QS.hint){
    QS.score++;
    if(!QS.isWrong){
      STREAKS[k]=(STREAKS[k]||0)+1; saveStreaks();
      if(STREAKS[k]>=MTHRESH&&!isMastered(w.id,mode)){
        setMastered(w.id,mode); delete STREAKS[k]; saveStreaks();
        QS.newM.push({w,mode}); showMToast((w.kanji||w.kana)+'('+modeLabel(mode)+')');
      }
    }
  } else if(!ok||QS.hint){
    if(!ok&&wo) wo.wrongCount++;
    WSET.add(w.id);
    if(!QS.isWrong){ STREAKS[k]=0; saveStreaks(); }
    WLOG.push({id:w.id,word:w.kanji||w.kana,ans:QS.cur.cA,date:new Date().toLocaleString('ko-KR')});
    QS.wrongs.push(w); saveWrong();
  }
  saveWords(WORDS);
}
function showMToast(word){ const t=document.getElementById('master-toast'); t.textContent=`⭐ "${word}" 마스터!`; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); }

function endQuiz(){
  document.getElementById('qscreen').style.display='none';
  document.getElementById('qresult').style.display='block';
  const pct=Math.round(QS.score/QS.words.length*100);
  document.getElementById('r-score').textContent=`${QS.score} / ${QS.words.length}`;
  document.getElementById('r-sub').textContent=`정답률 ${pct}%  ·  오답 ${QS.wrongs.length}개`;
  const rm=document.getElementById('r-master');
  rm.innerHTML=QS.newM.length?`<div style="font-size:12px;background:#FFF3CD;border:1px solid var(--gold);border-radius:8px;padding:7px 11px;margin-bottom:8px">⭐ 마스터: ${QS.newM.map(({w,mode})=>(w.kanji||w.kana)+'('+modeLabel(mode)+')').join(', ')}</div>`:'';
  const rw=document.getElementById('r-wrongs');
  rw.innerHTML=QS.wrongs.length?`<div style="font-size:12px;color:var(--accent);margin-bottom:4px">오답 목록</div><div class="wlist">${QS.wrongs.map(w=>`<div class="wrow"><span class="wq">${w.kanji||w.kana}</span><span>→ ${w.meaning}</span></div>`).join('')}</div>`:'<div style="text-align:center;color:var(--green);font-size:17px;padding:14px">🎉 오답 없음!</div>';
  updateHdr();
}

function addWord(){
  const kanji=(document.getElementById('add-kanji').value||'').trim();
  const kana=(document.getElementById('add-kana').value||'').trim();
  const mean=(document.getElementById('add-mean').value||'').trim();
  const note=(document.getElementById('add-note').value||'').trim();
  const theme=(document.getElementById('add-theme').value||'기타').trim();
  if(!kana||!mean){ alert('히라가나와 뜻은 필수예요.'); return; }
  const newId=Math.max(0,...WORDS.map(w=>w.id))+1;
  WORDS.push({id:newId,kanji,kana,meaning:mean,note,theme,addedAt:newId,quizCount:0,wrongCount:0,streak:0});
  saveWords(WORDS);
  ['add-kanji','add-kana','add-mean','add-note','add-theme'].forEach(id=>document.getElementById(id).value='');
  renderEdit(); renderThemeFilter(); renderQThemeFilter(); updateHdr();
}
function delWord(id){
  if(!confirm('삭제할까요?')) return;
  WORDS=WORDS.filter(w=>w.id!==id);
  Object.keys(MMAP).filter(k=>k.startsWith(id+'_')).forEach(k=>delete MMAP[k]);
  WSET.delete(id); saveMaster(); saveWrong(); saveWords(WORDS); renderEdit(); updateHdr();
}
function saveEdits(){
  const rows=document.querySelectorAll('#edit-body tbody tr');
  // 편집된 ID 목록
  const editedIds=new Set();
  const updated=[];
  rows.forEach(row=>{
    const id=parseInt(row.dataset.id);
    const kanji=(row.querySelector('[data-f="kanji"]').value||'').trim();
    const kana=(row.querySelector('[data-f="kana"]').value||'').trim();
    const mean=(row.querySelector('[data-f="meaning"]').value||'').trim();
    const note=(row.querySelector('[data-f="note"]').value||'').trim();
    const theme=(row.querySelector('[data-f="theme"]')?.value||'기타').trim();
    if(!kana||!mean) return;
    const orig=WORDS.find(w=>w.id===id)||{quizCount:0,wrongCount:0,streak:0,addedAt:id};
    updated.push({...orig,id,kanji,kana,meaning:mean,note,theme});
    editedIds.add(id);
  });
  // 테마 필터 중일 때: 보이지 않는 단어는 그대로 유지
  const kept=WORDS.filter(w=>!editedIds.has(w.id));
  WORDS=[...kept,...updated].sort((a,b)=>a.addedAt-b.addedAt);
  saveWords(WORDS); updateHdr(); renderDict(); renderEdit(); alert('저장됐어요!');
}

// ── 테마 관리 ──
function openThemeMgr(){ renderThemeMgrList(); document.getElementById('theme-modal').style.display='flex'; }
function closeThemeMgr(){ document.getElementById('theme-modal').style.display='none'; }
function renderThemeMgrList(){
  const themes=allThemes(); const cnt={};
  WORDS.forEach(w=>{ const t=w.theme||'기타'; cnt[t]=(cnt[t]||0)+1; });
  document.getElementById('theme-mgr-list').innerHTML=themes.map(t=>`<div style="display:flex;align-items:center;gap:7px;padding:6px 0;border-bottom:1px solid var(--border)"><span style="flex:1;font-size:13px">${esc(t)} <span style="color:var(--sub);font-size:11px">(${cnt[t]||0}개)</span></span><input id="rn-${esc(t)}" value="${esc(t)}" style="width:120px;padding:4px 7px;border:1.5px solid var(--border);border-radius:5px;font-size:12px;font-family:inherit"><button class="btn btn-blue btn-sm" onclick="renameTheme('${esc(t)}')">변경</button><button class="btn btn-danger btn-sm" onclick="deleteTheme('${esc(t)}')">삭제</button></div>`).join('');
}
function renameTheme(old){ const el=document.getElementById('rn-'+old); const nw=(el?.value||'').trim(); if(!nw||nw===old) return; WORDS.forEach(w=>{ if((w.theme||'기타')===old) w.theme=nw; }); saveWords(WORDS); if(dTheme===old) dTheme=nw; if(qTheme===old) qTheme=nw; renderThemeMgrList(); renderThemeFilter(); renderQThemeFilter(); renderDict(); }
function deleteTheme(name){ const cnt=WORDS.filter(w=>(w.theme||'기타')===name).length; if(!confirm(`"${name}" 삭제? 해당 단어 ${cnt}개는 "기타"로 이동`)) return; WORDS.forEach(w=>{ if((w.theme||'기타')===name) w.theme='기타'; }); saveWords(WORDS); if(dTheme===name) dTheme=''; if(qTheme===name) qTheme=''; renderThemeMgrList(); renderThemeFilter(); renderQThemeFilter(); renderDict(); }
function addTheme(){ const el=document.getElementById('new-theme'); const name=(el?.value||'').trim(); if(!name){ alert('테마명을 입력해주세요.'); return; } el.value=''; alert(`"${name}" 추가됐어요. 편집 탭에서 단어에 적용해주세요.`); closeThemeMgr(); }

//  플래시카드
// ══════════════════════════════════════════════
let fcPool='all', fcTheme='', fcState={};

function renderFCThemeFilter(){
  const el=document.getElementById('fc-theme-filter'); if(!el) return;
  el.innerHTML=['전체',...allThemes()].map(t=>`<button class="tchip${(t==='전체'&&!fcTheme)||(t===fcTheme)?' active':''}" style="font-size:11px;padding:3px 9px;" onclick="setFCTheme('${t==='전체'?'':t}')">${t}</button>`).join('');
}
function setFCTheme(t){ fcTheme=t; renderFCThemeFilter(); updateFCPool(); }
function setFCPool(p){ fcPool=p; if(p==='wrong') fcTheme=''; document.querySelectorAll('#fc-setup .ptab').forEach((b,i)=>b.classList.toggle('active',['all','wrong'][i]===p)); renderFCThemeFilter(); updateFCPool(); }
function getFCList(){
  let list = fcPool==='wrong' ? WORDS.filter(w=>WSET.has(w.id)) : [...WORDS];
  if(fcTheme) list=list.filter(w=>(w.theme||'기타')===fcTheme);
  return list;
}
function updateFCPool(){
  renderFCThemeFilter();
  const list=getFCList();
  document.getElementById('fc-pool-info').textContent=`${list.length}개 단어`;
}

function startFlash(){
  const list=getFCList();
  if(!list.length){ alert('단어가 없어요.'); return; }
  const order=document.getElementById('fc-order').value;
  let words=[...list];
  if(order==='random') words=shuffle(words);
  else if(order==='wrong') words=words.sort((a,b)=>b.wrongCount-a.wrongCount);
  fcState={ words, idx:0, known:0, unknown:0, unknownWords:[] };
  document.getElementById('fc-setup').style.display='none';
  document.getElementById('fc-result').style.display='none';
  document.getElementById('fc-screen').style.display='block';
  showFCCard();
}

function showFCCard(){
  if(fcState.idx>=fcState.words.length){ endFlash(); return; }
  const inner=document.getElementById('fc-inner');
  const wasFlipped=inner.classList.contains('flipped');

  // 버튼/힌트 즉시 숨김
  document.getElementById('fc-btns').style.display='none';
  document.getElementById('fc-tap-hint').style.display='block';

  function _update(){
    const w=fcState.words[fcState.idx];
    const showKanji=!!w.kanji;
    document.getElementById('fc-front-word').textContent=showKanji?w.kanji:w.kana;
    document.getElementById('fc-front-kana').textContent=showKanji?w.kana:'';
    document.getElementById('fc-back-mean').textContent=w.meaning;
    document.getElementById('fc-back-kana').textContent=w.kana;
    document.getElementById('fc-back-note').textContent=w.note||'';
    document.getElementById('fc-prog').textContent=`${fcState.idx+1} / ${fcState.words.length}  ✓${fcState.known}  ✗${fcState.unknown}`;
  }

  if(wasFlipped){
    // 뒤집혀 있으면: transition 완료 후 내용 업데이트
    inner.classList.remove('flipped');
    setTimeout(_update, 520); // transition 0.5s + 여유
  } else {
    // 앞면이면 바로 업데이트
    _update();
  }
}
function flipCard(){
  const inner=document.getElementById('fc-inner');
  if(inner.classList.contains('flipped')) return;
  inner.classList.add('flipped');
  document.getElementById('fc-tap-hint').style.display='none';
  document.getElementById('fc-btns').style.display='flex';
}
function fcAnswer(known){
  const w=fcState.words[fcState.idx];
  if(known){ fcState.known++; }
  else{ fcState.unknown++; fcState.unknownWords.push(w); }
  fcState.idx++;
  showFCCard();
}
function endFlash(){
  document.getElementById('fc-screen').style.display='none';
  document.getElementById('fc-result').style.display='block';
  const {known,unknown,unknownWords,words}=fcState;
  document.getElementById('fc-result-sub').textContent=`${words.length}개 중 ✓알아요 ${known}개 / ✗몰라요 ${unknown}개`;
  const retry=document.getElementById('fc-result-retry');
  if(unknownWords.length){
    retry.innerHTML=`<button class="btn btn-blue" style="width:100%;margin-bottom:6px" onclick="retryUnknown()">몰랐던 ${unknownWords.length}개만 다시</button>`;
  } else { retry.innerHTML='<div style="color:var(--green);font-size:15px;margin-bottom:8px">🎉 전부 알아요!</div>'; }
}
function retryUnknown(){
  fcState.words=shuffle([...fcState.unknownWords]);
  fcState.idx=0; fcState.known=0; fcState.unknown=0; fcState.unknownWords=[];
  document.getElementById('fc-result').style.display='none';
  document.getElementById('fc-screen').style.display='block';
  showFCCard();
}
function backFCSetup(){
  document.getElementById('fc-result').style.display='none';
  document.getElementById('fc-screen').style.display='none';
  document.getElementById('fc-setup').style.display='block';
  updateFCPool();
}

// ── 발음 듣기 ──
function speak(text){
  if(!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utt=new SpeechSynthesisUtterance(text);
  utt.lang='ja-JP'; utt.rate=0.9;
  // 일본어 음성 선택
  const voices=window.speechSynthesis.getVoices();
  const jaVoice=voices.find(v=>v.lang.startsWith('ja'));
  if(jaVoice) utt.voice=jaVoice;
  window.speechSynthesis.speak(utt);
}
function speakWord(){
  if(!fcState.words) return;
  const w=fcState.words[fcState.idx];
  if(w) speak(w.kana);
}

  buildModeCards(); updateHdr(); renderThemeFilter(); renderDict(); updatePool();

  if(window.speechSynthesis) window.speechSynthesis.getVoices();
}
